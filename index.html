<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家庭保修管家 · 家庭售后决策助手</title>
<style>
/* ============================================================
   家庭保修管家 · 设计系统 V2.0（GPT 共同设计，品牌方向 A「家庭售后档案馆」）
   标题思源宋体、正文思源黑体、数字 Inter、档案编号 IBM Plex Mono。
   圆角：卡 14 / 档案卡 16 / 主卡 20 / 按钮 8（禁全胶囊）/ 标签 999 / 弹窗 20。
   大面积渐变只许品牌封面。
   V2.1 支付宝生态适配：平台交互语言换血——主背景 #F5F7FA / 卡面白＋#E8EAED
   描边 / 主文字 #1F2329 / 次文字 #646A73 / 主操作蓝 #1677FF / 蓝浅底 #EAF3FF；
   品牌棕 #79502E、印章金 #B58B50 降为品牌识别辅助色，只出现在品牌区、
   结论卡、档案编号/印章等品牌元素上，不再占主按钮与导航选中态。
   ============================================================ */
:root{
  --paper:#F5F7FA;            /* 页面主背景（V2.1 平台灰） */
  --paper-deep:#EAEDF1;       /* 分区背景/进度槽 */
  --surface:#FFFFFF;          /* 卡片面 */
  --surface-warm:#F4F6F9;     /* 次级面（浅灰） */
  --ink:#1F2329;              /* 主文字 */
  --ink2:#646A73;             /* 次文字 */
  --ink3:#8F959E;             /* 弱文字/元信息 */
  --line:#E8EAED;             /* 常规描边/分割线 */
  --line2:#D3D8DF;            /* 强描边 */
  --action:#1677FF;           /* 主操作蓝（V2.1） */
  --action-deep:#0E5BD7;      /* 主操作蓝 按下/悬停 */
  --action-soft:#EAF3FF;      /* 蓝浅底 */
  --action-line:#A8CBFF;      /* 蓝色浅描边 */
  --brand:#79502E;            /* 档案棕 */
  --brand-deep:#30251C;       /* 深色面板/页眉 */
  --brand-deep2:#453322;      /* 深色面板渐变次停（仅品牌封面） */
  --bronze:#B58B50;           /* 印章金（限频点缀） */
  --bronze-soft:#F1E5CB;
  --accent-soft:#EAF3FF;      /* 交互悬停浅底（V2.1 由暖米改蓝浅底） */
  --ok:#26734D;   --ok-soft:#E2EFE3;
  --warn:#B77925; --warn-soft:#F7ECD2;
  --bad:#B94335;  --bad-soft:#F9E7E1;
  --info:#64748B; --info-soft:#E9EDF1;
  --evi:#426B9A;              /* 证据提示 */
  --man:#805F99;              /* 待人工确认 */
  /* V2.1 令牌补全：原先散落在各组件里的写死色值统一收口到这里 */
  --deep-1:#3A2B1C;           /* 深色封面渐变亮停 */
  --deep-2:#241A10;           /* 深色封面渐变暗停 */
  --on-dark:#F5EBD7;          /* 深色面主文字 */
  --on-dark2:#D9C6A5;         /* 深色面次文字 */
  --gold-soft:#C8A96A;        /* 深色面上的金色文字/描边 */
  --gold-pale:#E9D9B4;        /* 深色面高亮小字 */
  --brand-hover:#684326;      /* 品牌按钮悬停 */
  --amber-ink:#7A5510;        /* 金色底上的深字 */
  --warn-ink:#7A4A08;         /* 警告底上的深字 */
  --bad-ink:#7C2A20;          /* 危险底上的深字 */
  --banner-ink:#14489B;       /* 横幅文字（V2.1 蓝色信息横幅） */
  --bad-line:#EFC0B8;         /* 危险描边 */
  --warn-line:#EFD3A4;        /* 警告描边 */
  --risk-line:#EFC9A8;        /* 风险行描边 */
  --banner-line:#BFD9FF;      /* 横幅描边（V2.1） */
  --t1:#26734D; --t2:#426B9A; --t3:#79502E; --t4:#B77925; --t5:#64748B; --t6:#805F99;
  /* 圆角（任务书）：普通卡 12 / 重点卡 14 / 结论卡 18 / 按钮 8 / 弹窗 16 */
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
  --sh-card:0 1px 3px rgba(31,35,41,.04),0 4px 12px rgba(31,35,41,.04);
  --sh-lift:0 4px 16px rgba(31,35,41,.08);
  --sh-pop:0 12px 40px rgba(31,35,41,.16);
  --focus:#1677FF;
  --header-h:64px;
  --font-serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --font-num:"Inter",-apple-system,"PingFang SC",sans-serif;
  --font-mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;}
::selection{background:#CFE4FF;}
button{font-family:inherit;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px;}
.ic{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.ic.lg{width:22px;height:22px;} .ic.sm{width:15px;height:15px;}

/* ---------- 顶部 App Bar（V2.1 任务书：56px 白底＋1px 分割线；顶栏专项改造：Logo 去金块改蓝白体系，与整体蓝白 UI 对齐） ---------- */
header.site{background:#FFFFFF; color:var(--ink); height:56px; display:flex; align-items:center;
  padding:0 16px; border-bottom:1px solid #E8EAED; position:relative; z-index:40;}
.brand-row{display:flex; align-items:center; gap:10px; max-width:860px; margin:0 auto; width:100%;}
.brand-mark{width:36px; height:36px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:#EAF3FF;}
.brand-mark .logo-shield{width:22px; height:22px; display:block;}
.brand-txt{flex:1 1 auto; min-width:0;}
.brand-txt h1{margin:0; font-size:16px; font-weight:600; color:#202A35; letter-spacing:.3px; white-space:nowrap;}
.brand-txt p{margin:2px 0 0; font-size:11px; font-weight:400; color:#747C86; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-ver{margin-left:auto; flex:none; font-size:11px; color:var(--ink2); border:1px solid var(--line);
  background:var(--surface-warm); padding:3px 9px; border-radius:var(--r-pill); letter-spacing:.5px;}

/* ---------- 导航（分段标签） ---------- */
nav.tabs{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);}
.tabs-in{max-width:860px; margin:0 auto; display:flex; gap:6px; padding:8px 12px;}
nav.tabs button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; min-height:44px; white-space:nowrap;
  border:1px solid transparent; background:transparent; border-radius:var(--r-sm);
  font-size:14.5px; color:var(--ink2); cursor:pointer; transition:background .18s,color .18s,border-color .18s;}
@media (max-width:560px){
  nav.tabs button{font-size:13px; gap:4px; padding:0 2px;}
  nav.tabs button .ic{width:16px; height:16px;}
  .tabs-in{padding:6px 8px; gap:4px;}
  .brand-txt h1{font-size:16px;}
  .brand-txt p{font-size:11px; white-space:nowrap;}
  .brand-ver{display:none;}
  .brand-row{gap:9px;}
}
nav.tabs button .ic{width:19px;height:19px;}
nav.tabs button:hover{color:var(--ink); background:#EEF1F5;}
/* V2.1：选中态改轻量蓝（蓝图标＋浅蓝底），去掉整块深棕选中块 */
nav.tabs button.active{background:var(--action-soft); color:var(--action); border-color:transparent; font-weight:600; letter-spacing:.5px;}
.badge{display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 5px; border-radius:var(--r-pill);
  background:var(--bad); color:#fff; font-size:11px; font-weight:700; line-height:1;}

/* ---------- 布局/视图 ---------- */
main{max-width:860px; margin:0 auto; padding:16px 12px 96px;}
section.view{display:none;}
section.view.active{display:block; animation:viewIn .2s ease both;}
@keyframes viewIn{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;}}

/* ---------- 卡片与按钮 ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:16px; margin-bottom:12px; box-shadow:var(--sh-card);}
button.card, .card.clickable{cursor:pointer; transition:transform .15s,box-shadow .15s,border-color .15s;}
.card.clickable:hover{border-color:var(--line2); box-shadow:var(--sh-lift); transform:translateY(-1px);}
.card.clickable:active{transform:translateY(0) scale(.995);}
/* V2.1 按钮体系：主操作蓝底白字 / 次操作白底蓝边蓝字 / 普通操作透明底灰字 / 危险红字浅红底 */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:44px;
  border:1px solid var(--action); color:var(--action); background:#fff;
  border-radius:var(--r-sm); padding:8px 16px; font-size:14px; font-weight:500; cursor:pointer;
  transition:background .15s,color .15s,transform .1s,box-shadow .15s;}
.btn:hover{background:var(--action-soft);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--action); color:#fff; border-color:var(--action); box-shadow:0 6px 14px -8px rgba(22,119,255,.55);}
.btn.primary:hover{background:var(--action-deep); border-color:var(--action-deep);}
.btn.ghost{border-color:transparent; color:var(--ink2); background:transparent;}
.btn.ghost:hover{background:#EEF1F5; color:var(--ink);}
/* 危险操作（删除档案/移除凭证）：按现有 onclick 入口纯 CSS 命中，不动任何 JS */
button.btn[onclick^="delProduct"], button.btn[onclick^="removeEvidence"]{color:var(--bad); border-color:transparent; background:transparent;}
button.btn[onclick^="delProduct"]:hover, button.btn[onclick^="removeEvidence"]:hover{background:var(--bad-soft); color:var(--bad);}
.btn.small{min-height:44px; padding:6px 12px; font-size:13px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
.toolbar input[type=search], .toolbar select{min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:var(--r-sm); font-size:14px; background:var(--surface); color:var(--ink);}
.toolbar input[type=search]{flex:1; min-width:140px;}
.toolbar input[type=search]:focus, .toolbar select:focus{border-color:var(--action);}

/* ---------- 徽章/标签 ---------- */
.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:var(--r-pill);
  font-size:12px; font-weight:600; color:#fff; white-space:nowrap; line-height:1.5;}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.85);}
.st-在保{background:var(--ok);} .st-临近到期{background:var(--warn);} .st-已过保{background:var(--bad);} .st-信息不全{background:var(--info);}
.tier-1{background:var(--t1);} .tier-2{background:var(--t2);} .tier-3{background:var(--t3);} .tier-4{background:var(--t4);} .tier-5{background:var(--t5);} .tier-6{background:var(--t6);}
.demo-tag{display:inline-flex; align-items:center; padding:1px 8px; border-radius:6px; background:var(--bronze-soft); color:var(--amber-ink); font-size:11px; font-weight:600; margin-left:6px; vertical-align:2px;}

/* ---------- 档案列表卡 ---------- */
/* V2.1：旧 .prod-card 档案卡已删除，档案页与概览统一用 .tile 组件 */
.prod-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.prod-name{font-weight:700; font-size:16.5px; letter-spacing:.2px;}
.prod-sub{color:var(--ink2); font-size:13px; margin-top:1px;}

.meter{height:6px; border-radius:3px; background:var(--paper-deep); margin-top:9px; overflow:hidden;}
.meter i{display:block; height:100%; border-radius:3px; background:var(--info); transition:width .6s ease;}
.meter i.ok{background:var(--ok);} .meter i.warn{background:var(--warn);} .meter i.bad{background:var(--bad);}

/* ---------- 结论卡（视觉主角） ---------- */
.conclusion{background:var(--surface); border:1px solid var(--line2); border-radius:var(--r-lg);
  box-shadow:var(--sh-lift); margin:12px 0; overflow:hidden;}
.concl-facts{border-top:1px dashed var(--line); padding:6px 16px 4px;}
.concl-facts .fr{display:flex; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
.concl-facts .fr:last-child{border-bottom:0;}
.concl-facts .fk{width:74px; flex:none; color:var(--ink3); font-size:12.5px; padding-top:1px;}
.concl-facts .fv{min-width:0;}
.concl-unv{margin:8px 16px 0; display:flex; gap:8px; background:var(--warn-soft); border:1px solid var(--warn-line);
  border-radius:var(--r-md); padding:9px 12px; font-size:13px; color:var(--warn-ink);}
.concl-unv .ic{color:var(--warn); margin-top:2px;}
.concl-actions{padding:11px 16px 4px;}
.concl-actions .at{font-size:12.5px; color:var(--ink3); margin-bottom:7px; letter-spacing:.5px;}
.concl-actions ol{margin:0; padding:0; list-style:none; counter-reset:act;}
.concl-actions li{counter-increment:act; display:flex; gap:9px; font-size:13.5px; padding:4px 0; align-items:flex-start;}
.concl-actions li::before{content:counter(act); flex:none; width:19px; height:19px; border-radius:50%; margin-top:1px;
  background:var(--bronze-soft); color:var(--amber-ink); font-size:11.5px; font-weight:700; display:grid; place-items:center;}
.concl-foot{padding:9px 16px 12px; font-size:12px; color:var(--ink3); display:flex; flex-wrap:wrap; gap:4px 14px;}

/* ---------- 对话 ---------- */
#chatLog{display:flex; flex-direction:column; gap:14px; margin-bottom:12px;}
.msg-row{display:flex; gap:9px; align-items:flex-start; animation:viewIn .2s ease both;}
.msg-row.user{flex-direction:row-reverse;}
.avatar{width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--brand-deep2),var(--brand-deep)); color:#F3E3BC; border:1px solid rgba(216,183,106,.5);}
.avatar .ic{width:19px; height:19px;}
.msg{max-width:82%; padding:11px 14px; border-radius:18px; font-size:14.5px; white-space:pre-wrap; word-break:break-word; line-height:1.65;}
.msg.bot{background:var(--surface); border:1px solid var(--line); border-top-left-radius:6px; box-shadow:var(--sh-card);}
.msg.user{background:var(--action); color:#fff; border-top-right-radius:6px; box-shadow:0 6px 14px -8px rgba(22,119,255,.5);}
.msg.has-html{max-width:100%; flex:1; min-width:0;}
.msg .msg .conclusion{margin:9px 0 3px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px;}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:44px; border:1px solid var(--line2); color:var(--action);
  background:var(--surface); border-radius:var(--r-sm); padding:6px 13px; font-size:13.5px; font-weight:500; cursor:pointer;
  transition:background .15s,transform .1s,border-color .15s;}
.chip:hover{background:var(--action-soft); border-color:var(--action-line);}
.chip:active{transform:scale(.96);}
.chip .ic{width:16px; height:16px;}
.chat-input{display:flex; gap:8px; position:sticky; bottom:12px; z-index:10;
  background:var(--surface); border:1px solid var(--line2); border-radius:16px; padding:5px 5px 5px 16px; box-shadow:var(--sh-lift);}
.chat-input input{flex:1; min-width:0; border:0; background:transparent; font-size:15px; color:var(--ink); padding:8px 0;}
.chat-input input::placeholder{color:var(--ink3);}
.send-btn{width:44px; height:44px; border-radius:12px; border:0; flex:none; display:grid; place-items:center;
  background:var(--action); color:#fff; cursor:pointer; transition:background .15s,transform .1s;}
.send-btn:hover{background:var(--action-deep);} .send-btn:active{transform:scale(.93);}
.send-btn .ic{width:19px; height:19px;}

/* ---------- 弹窗（移动端底部弹层 / 桌面居中卡） ---------- */
.modal-mask{display:none; position:fixed; inset:0; background:rgba(31,35,41,.5); z-index:60; overflow-y:auto;
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
.modal-mask.open{display:flex; align-items:flex-end; justify-content:center;}
.modal{background:var(--surface); width:100%; max-width:640px; max-height:92dvh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); animation:sheetIn .26s ease both;}
@keyframes sheetIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
@media (min-width:640px){
  .modal-mask.open{align-items:center; padding:24px 12px;}
  .modal{border-radius:16px; box-shadow:var(--sh-pop);}
}
.modal h3{margin:0 0 14px; font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;}
.modal h3 .ic{color:var(--action); width:20px; height:20px;}
.modal .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap;}
.frow{margin-bottom:12px;}
.frow label{display:block; font-size:13px; color:var(--ink2); margin-bottom:5px; font-weight:500;}
.frow input,.frow select,.frow textarea{width:100%; min-height:44px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--r-md); font-size:14.5px; background:var(--surface); color:var(--ink); font-family:inherit;}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--action);}
.frow .conf{font-size:12px; margin-left:6px;}
.conf.hi{color:var(--ok);} .conf.lo{color:var(--bad); font-weight:700;}
.frow.lowconf input,.frow.lowconf select{border-color:var(--bad); background:var(--bad-soft);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:560px){ .grid2{grid-template-columns:1fr;} }
.hint{font-size:13px; color:var(--ink2); background:var(--surface-warm); border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px; margin-bottom:12px;}
.warnbox{font-size:13.5px; color:var(--bad); background:var(--bad-soft); border:1px solid var(--bad-line); border-radius:var(--r-md); padding:10px 12px; margin-bottom:12px;}

/* ---------- 详情/表格/时间线 ---------- */
table.kv{width:100%; border-collapse:collapse; font-size:14px;}
table.kv td{padding:6px; border-bottom:1px dashed var(--line); vertical-align:top;}
table.kv tr:last-child td{border-bottom:0;}
table.kv td.k{width:96px; color:var(--ink3); font-size:13px;}
.timeline{border-left:2px solid var(--line2); margin:8px 0 0 6px; padding-left:15px;}
.timeline .ev{margin-bottom:11px; font-size:14px; position:relative;}
.timeline .ev::before{content:""; position:absolute; left:-20.5px; top:7px; width:7px; height:7px; border-radius:50%; background:var(--action); border:2px solid var(--surface);}
.timeline .ev .d{color:var(--ink3); font-size:12.5px; font-variant-numeric:tabular-nums;}
pre.pkg{white-space:pre-wrap; background:var(--surface-warm); border:1px solid var(--line); border-radius:var(--r-md); padding:13px; font-size:13.5px; font-family:inherit; line-height:1.7;}
.sec-title{font-weight:700; margin:4px 0 10px; font-size:15px; display:flex; align-items:center; gap:8px;}
.sec-title .ic{color:var(--action); width:19px; height:19px;}
a{color:var(--action);}

/* ---------- 空状态/横幅 ---------- */
.empty{padding:40px 20px 34px; text-align:center; background:var(--surface); border:1px dashed var(--line2); border-radius:var(--r-lg);}
.empty .eic{width:60px; height:60px; margin:0 auto 12px; border-radius:50%; background:var(--action-soft); border:1px solid var(--action-line);
  display:grid; place-items:center; color:var(--action);}
.empty .eic .ic{width:29px; height:29px;}
.empty .et{font-size:15.5px; font-weight:700; margin-bottom:4px;}
.empty .es{font-size:13.5px; color:var(--ink2); max-width:340px; margin:0 auto;}
.banner{display:flex; gap:9px; background:var(--action-soft); border:1px solid var(--banner-line); color:var(--banner-ink);
  border-radius:var(--r-md); padding:10px 13px; font-size:13.5px; margin-bottom:12px; align-items:flex-start;}
.banner .ic{color:var(--action); margin-top:2px;}
/* GPT 补审 10：提醒页小标题＋蓝色系统说明框压缩（上下内边距收紧、标题 13px、正文 12px，内容不删） */
.rem-head{font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:.3px; margin:0 2px 10px;}
#view-reminders .banner{padding:7px 13px; font-size:12px; line-height:1.55;}
#view-reminders .banner strong{font-size:13px;}
#view-reminders .banner .ic{margin-top:1px;}

/* ---------- v1.2：宽布局 / 概览首屏 / 档案墙 / 结论卡风险区与证据链 ---------- */
.brand-row,.tabs-in{max-width:1240px;}
main{max-width:1240px; padding:16px 16px 96px;}
#view-chat{max-width:880px; margin:0 auto;}
.set-btn{margin-left:8px; flex:none; width:40px; height:40px; border-radius:10px; border:0;
  background:transparent; color:#66717F; display:grid; place-items:center; cursor:pointer; transition:background .15s,color .15s,transform .1s;}
.set-btn .ic{width:20px; height:20px;}
.set-btn:hover{background:#EAF3FF; color:#1677FF;}
.set-btn:active{background:#EAF3FF; color:#1677FF; transform:scale(.94);}
.home-sec{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15.5px; margin:18px 0 10px; letter-spacing:.3px;}
.home-sec .ic{color:var(--action); width:19px; height:19px;}
.home-sec .more{margin-left:auto; font-size:13px; font-weight:500;}
.risk-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--risk-line); border-left:4px solid var(--warn);
  border-radius:var(--r-md); padding:11px 14px; margin-bottom:8px; box-shadow:var(--sh-card); cursor:pointer; transition:transform .15s,box-shadow .15s;}
.risk-row.over{border-color:var(--bad-line); border-left-color:var(--bad);}
.risk-row:hover{box-shadow:var(--sh-lift); transform:translateY(-1px);}
.risk-row .rn2{font-weight:700; font-size:14.5px;}
.risk-row .rs{font-size:12.5px; color:var(--ink2);}
.risk-row .rd{margin-left:auto; text-align:right; flex:none;}
.risk-row .rd .n{font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
.risk-row .rd .u{font-size:11.5px; color:var(--ink2);}
.wall{display:grid; grid-template-columns:1fr; gap:10px;}
@media (min-width:640px){ .wall{grid-template-columns:1fr 1fr;} }
@media (min-width:1020px){ .wall{grid-template-columns:1fr 1fr 1fr;} }
.tile{display:flex; gap:13px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px; box-shadow:var(--sh-card); cursor:pointer; transition:transform .15s,box-shadow .15s,border-color .15s; text-align:left; width:100%; font-family:inherit; color:var(--ink);}
.tile:hover{border-color:var(--line2); box-shadow:var(--sh-lift); transform:translateY(-2px);}
.cat-ic{width:52px; height:52px; border-radius:15px; flex:none; display:grid; place-items:center;}
.cat-ic .ic{width:29px; height:29px; stroke-width:1.6;}
.tile .tn{font-weight:700; font-size:15.5px; line-height:1.35;}
.tile .ts{font-size:12.5px; color:var(--ink2); margin-top:1px;}
.tile .td{margin-top:7px; display:flex; align-items:baseline; gap:6px;}
.tile .td .n{font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
.tile .td .u{font-size:12px; color:var(--ink2);}
.tile .tp{margin-top:8px; display:flex; gap:5px; flex-wrap:wrap;}
/* V2.1：档案页与概览共用 .wall 网格（桌面 3 列/平板 2 列/手机 1 列），空状态占满整行 */
#prodList .empty{grid-column:1/-1;}
.concl-risk{margin:10px 16px 0; background:var(--bad-soft); border:1px solid var(--bad-line); border-radius:var(--r-md); padding:10px 13px;}
.concl-risk .rk-t{display:flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; color:var(--bad); margin-bottom:4px;}
.concl-risk .rk-i{font-size:13.5px; color:var(--bad-ink); padding:2px 0 2px 4px;}
.concl-chain{border-top:1px dashed var(--line); padding:10px 16px 2px;}
.concl-chain .at{font-size:12.5px; color:var(--ink3); margin-bottom:2px; letter-spacing:.5px;}
.confirm-line{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; background:var(--surface-warm);
  border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px; margin-bottom:12px; cursor:pointer;}
.confirm-line input{width:19px; height:19px; margin-top:2px; flex:none; accent-color:var(--action);}
.typing{display:inline-flex; gap:5px; padding:4px 2px;}
.typing i{width:7px; height:7px; border-radius:50%; background:var(--ink3); animation:tp 1.1s infinite;}
.typing i:nth-child(2){animation-delay:.18s;} .typing i:nth-child(3){animation-delay:.36s;}
@keyframes tp{0%,60%,100%{opacity:.25; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);}}

/* ---------- V2.0「家庭售后档案馆」组件层 ---------- */
.dnum,.tile .td .n,.risk-row .rd .n,.tk .tv .n,.statbar .sb-n{font-family:var(--font-num);}
.sec-title,.home-sec,.modal h3{font-family:var(--font-serif); letter-spacing:.5px;}
.modal{border-radius:16px 16px 0 0;}
@media (min-width:640px){ .modal{border-radius:16px;} }
.arch-no{font-family:var(--font-mono); font-size:11px; letter-spacing:.6px; color:var(--ink3); white-space:nowrap;}
.arch-no.on-dark{color:var(--gold-soft);}
.cat-ic{border-radius:12px; box-shadow:inset 0 0 0 1.5px rgba(31,35,41,.10), inset 0 0 0 4px rgba(255,255,255,.55);}

/* 首屏一区：深色品牌主视觉横幅（全站唯一允许大面积深色渐变处） */
.hero{position:relative; overflow:hidden; border-radius:var(--r-lg); margin-bottom:12px; color:var(--on-dark);
  background:linear-gradient(150deg,var(--deep-1) 0%,var(--brand-deep) 55%,var(--deep-2) 100%); padding:20px 22px 15px; box-shadow:var(--sh-lift);}
.hero .h-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:3.5px; color:var(--gold-soft); margin-bottom:7px; position:relative; z-index:1;}
.hero h2{font-family:var(--font-serif); font-size:clamp(21px,4.2vw,29px); font-weight:900; line-height:1.28; margin:0 0 6px; letter-spacing:1px; position:relative; z-index:1; text-wrap:balance;}
.hero p{margin:0; font-size:13.5px; line-height:1.5; color:var(--on-dark2); max-width:560px; position:relative; z-index:1;}
.hero .h-actions{display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:11px; position:relative; z-index:1;}
.hero .btn{border-color:rgba(200,169,106,.65); color:var(--on-dark); background:rgba(255,252,246,.06);}
.hero .btn:hover{background:rgba(255,252,246,.14);}
.hero .btn.gold{background:var(--bronze); border-color:var(--bronze); color:#2A1D0E; font-weight:700;}
.hero .btn.gold:hover{background:#C29A5E;}
.hero .h-meta{margin-top:14px; font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; color:rgba(217,198,165,.75); position:relative; z-index:1;}
/* V2.2：版本行并入动作行同排（省一整行纵向空间，Hero 压缩的一部分） */
.hero .h-actions .h-meta{margin-top:0;}

/* 首屏二区：统计卡（V2.2 推倒重做）——四指标单行四列等宽网格＋待处理整行入口同卡收纳。
   去塑料感要点（GPT 验收表）：取消竖分割线、用间距建秩序；禁止不受控折行；
   数字 26px/650/行高 30px/tabular-nums/系统字体；标签 12px 单行不折、与数字间距 3px。 */
.statbar{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--sh-card); margin-bottom:6px; overflow:hidden;}
.statbar .sb-row{display:grid; grid-template-columns:repeat(4,1fr); padding:11px 6px 9px;}
.statbar .sb{padding:0 10px; min-width:0;}
.statbar .sb-n{font-size:26px; font-weight:650; line-height:30px; font-variant-numeric:tabular-nums;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
.statbar .sb-l{font-size:12px; line-height:17px; color:var(--ink2); margin-top:3px; white-space:nowrap; overflow:hidden;}
.statbar .sb.hot .sb-n{color:var(--bad);} .statbar .sb.warm .sb-n{color:var(--warn);} .statbar .sb.good .sb-n{color:var(--ok);}
@media (max-width:350px){ .statbar .sb-row{grid-template-columns:repeat(2,1fr); row-gap:10px;} }

/* 首屏五区：快捷入口 */
.quick-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
@media (min-width:760px){ .quick-grid{grid-template-columns:repeat(4,1fr);} }
.quick{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:13px 14px; cursor:pointer; box-shadow:var(--sh-card); transition:transform .15s,box-shadow .15s,border-color .15s; text-align:left; font-family:inherit; color:var(--ink); width:100%;}
.quick:hover{border-color:var(--line2); box-shadow:var(--sh-lift); transform:translateY(-2px);}
.quick .q-ic{width:40px; height:40px; border-radius:10px; flex:none; display:grid; place-items:center; background:var(--action-soft); border:1px solid transparent; color:var(--action);}
.quick .q-ic .ic{width:21px; height:21px;}
.quick .q-t{font-weight:700; font-size:14.5px;}
.quick .q-s{font-size:12px; color:var(--ink2);}

/* 档案墙 V2：编号置右上、层级分明 */
.tile{display:block;}
.tile-top{display:flex; align-items:flex-start; gap:12px;}
.tile-main{display:block; margin-top:10px;}
.tile-main .tn{display:inline;}
.tile-main .ts{display:block; margin-top:2px;}
.tile .arch-no{margin-left:auto; padding-top:3px;}

/* 结论卡 V2：深色封面 + 横向时间线 + 01/02/03 分区 */
.conclusion{border-radius:var(--r-lg); border-color:var(--line2);}
.concl-cover{background:linear-gradient(155deg,var(--deep-1) 0%,var(--brand-deep) 58%,var(--deep-2) 100%); color:var(--on-dark); padding:18px 20px 16px; position:relative; overflow:hidden;}
.concl-cover::after{content:""; position:absolute; right:-38px; top:-38px; width:150px; height:150px; border-radius:50%;
  border:1.5px solid rgba(181,139,80,.38); box-shadow:0 0 0 11px rgba(181,139,80,.06), 0 0 0 24px rgba(181,139,80,.04);}
.cc-eyebrow{display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:2.6px; color:var(--gold-soft); position:relative; z-index:1;}
.cc-eyebrow .arch-no{margin-left:auto;}
.cc-name{font-size:13.5px; color:var(--on-dark2); margin-top:9px; position:relative; z-index:1;}
.cc-verdict{font-family:var(--font-serif); font-size:clamp(21px,3.4vw,27px); font-weight:900; letter-spacing:1px; line-height:1.25; margin-top:2px; position:relative; z-index:1;}
.cc-badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; position:relative; z-index:1;}
.cc-hero{display:flex; align-items:flex-end; gap:22px; margin-top:14px; flex-wrap:wrap; position:relative; z-index:1;}
.cc-big{display:flex; align-items:baseline; gap:7px;}
.cc-big .n{font-family:var(--font-num); font-size:52px; font-weight:800; line-height:.95; letter-spacing:-1.5px; font-variant-numeric:tabular-nums;}
.cc-big .u{font-size:13px; color:var(--on-dark2);}
.cc-side{font-size:12.5px; color:var(--on-dark2); line-height:1.75; padding-bottom:4px;}
.cc-side b{color:var(--on-dark); font-variant-numeric:tabular-nums;}
.cc-tierdesc{font-size:12.5px; color:rgba(217,198,165,.85); margin-top:9px; position:relative; z-index:1;}
.cc-timeline{margin-top:15px; position:relative; z-index:1;}
.cc-tl-track{position:relative; height:4px; border-radius:2px; background:rgba(245,235,215,.18);}
.cc-tl-fill{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--bronze);}
.cc-tl-dot{position:absolute; top:50%; width:11px; height:11px; border-radius:50%; transform:translate(-50%,-50%); background:var(--on-dark); border:2.5px solid var(--bronze);}
.cc-tl-dot.today{background:#79B8FF; border-color:#79B8FF;}
.cc-tl-labels{position:relative; height:16px; margin-top:8px; font-size:11px; color:rgba(217,198,165,.85); font-variant-numeric:tabular-nums;}
/* V2.1 查杀·P2：窄屏下「今天」与「起算」标签位置接近时用深色光晕隔开，避免字形交叠（纯视觉，不动时间线计算） */
.cc-tl-labels span{position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; text-shadow:0 0 3px #241A10,0 0 5px #241A10,0 0 5px #241A10;}
.cc-tl-labels .mid{z-index:1;}
.cc-tl-labels span:first-child{transform:none;}
.cc-tl-labels span:last-child{transform:translateX(-100%);}
.cc-tl-labels .mid{color:var(--gold-pale); font-weight:600;}
/* 待统一修改·结论卡时间线标签拥挤：中间标签与首/尾标签实测重叠时错行到第二行
   （fixCcTlLabels 渲染后实测判定，纯标签层排版，不动节点位置与日期计算） */
.cc-tl-labels.stagger{height:33px;}
.cc-tl-labels span.st-row2{top:17px;}
/* GPT 终审 P1：节点错层（fixCcTlLabels 实测横距 <12px 时加类）——横坐标不动，
   今天点上移、到期点下移，两点圆心竖距约 19px，彻底分开；颜色沿用既有（今天蓝、到期金边） */
.cc-timeline.dots-stagger .cc-tl-dot[data-k="today"]{transform:translate(-50%,-135%);}
.cc-timeline.dots-stagger .cc-tl-dot[data-k="end"]{transform:translate(-50%,35%);}
.concl-sec{display:flex; gap:13px; padding:14px 18px 6px;}
.concl-sec .sec-no{font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--bronze); border:1px solid var(--line2);
  border-radius:8px; width:34px; height:26px; flex:none; display:grid; place-items:center; background:var(--surface-warm); margin-top:1px;}
.concl-sec .sec-body{flex:1; min-width:0;}
.concl-sec .sec-t{font-family:var(--font-serif); font-weight:700; font-size:14.5px; letter-spacing:.6px; margin-bottom:5px;}
.concl-sec .concl-facts{border-top:0; padding:0;}
.concl-sec .concl-chain{border-top:0; padding:4px 0 2px;}
.concl-sec .concl-unv{margin:6px 0 4px;}
.concl-sec .concl-risk{margin:6px 0 4px;}
.concl-sec .concl-actions{padding:2px 0 4px;}
.concl-btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.conclusion .concl-foot{border-top:1px dashed var(--line); margin-top:10px;}

/* 类别图标配色（V2.1 收口：原先写死在 JS 的 CAT_META 色值统一进样式表） */
.cat-ic.k-大家电{background:#E9EDF1; color:#426B9A;}
.cat-ic.k-小家电{background:#F1E5CB; color:#7A5510;}
.cat-ic.k-厨电{background:#F3E3CE; color:#79502E;}
.cat-ic.k-手机数码{background:#E2EFE3; color:#26734D;}
.cat-ic.k-电脑{background:#EAE1D2; color:#64748B;}
.cat-ic.k-家具{background:#F1E5CB; color:#6E4E0D;}
.cat-ic.k-其他{background:#EAE1D2; color:#6E5B45;}

/* ---------- V2.1 第二轮精修（GPT 复审清单 A1/A2/B/C1/C2/C3/一致性） ---------- */
/* A1：首屏横幅品牌图形——低对比「档案印章」（盾牌＋档案页折角＋细圆环），替代原同心圆 */
.hero-seal{position:absolute; right:16px; top:12px; width:158px; height:158px; opacity:.11; color:var(--gold-pale);
  pointer-events:none; z-index:0;}
.hero .h-demo-note{margin-top:7px; font-size:12.5px; color:var(--on-dark2); position:relative; z-index:1;}
/* V2.2：待处理售后剥离统计格，改为统计卡下方整行 List Cell 入口（左图标底板＋主副文＋右端计数）。
   元素保留 sb act 类与原点击/Enter/Space 行为（v1.4 回归断言锚点），视觉不再用独立浅蓝矩形块。 */
.statbar .pending-cell{display:flex; align-items:center; gap:11px; border-top:1px solid var(--line);
  padding:10px 14px; cursor:pointer; transition:background .15s;}
.pending-cell:hover{background:#F5F9FF;}
.pending-cell:active{background:var(--action-soft);}
.pending-cell .pc-ic{width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:var(--action-soft); color:var(--action);}
.pending-cell .pc-ic .ic{width:19px; height:19px;}
.pending-cell .pc-main{flex:1; min-width:0;}
.pending-cell .pc-t{display:block; font-weight:700; font-size:14px; line-height:1.35; color:var(--ink);}
.pending-cell .pc-s{display:block; font-size:12px; line-height:1.4; color:var(--ink2); margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pending-cell .pc-go{flex:none; font-size:13px; font-weight:700; color:var(--action);}
/* V2.2：首页风险清单与档案页统一为 List Cell 分组——整组一张白底、行间发丝分割线，
   不再逐条独立大卡（去塑料感：秩序来自对齐与间距，不是每条都套个盒子）。 */
.risk-group{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--sh-card); overflow:hidden; margin-bottom:6px;}
.risk-group .risk-row{border:0; border-bottom:1px solid var(--line); border-radius:0;
  box-shadow:none; margin:0; background:transparent;}
.risk-group .risk-row:last-child{border-bottom:0;}
.risk-group .risk-row:hover{transform:none; box-shadow:none;}
/* V2.2：商品图位（1:1）——有真实照片/演示图时占类目图标位，无图回退类目图标占位 */
.tile-photo{width:52px; height:52px; border-radius:12px; flex:none; display:block; object-fit:cover; background:#EDF0F3;}
#prodList .tile-photo{width:40px; height:40px; border-radius:10px;}
.detail-photo{width:84px; height:84px; border-radius:12px; flex:none; display:block; object-fit:cover; background:#EDF0F3;}
.prod-head .ph-main{flex:1; min-width:0;}
/* C1：档案卡层级——商品名 17 / 型号类别 12 / 编号弱化 10 / 剩余天数 26；证据档位标签降权 */
.tile .tn{font-size:17px;}
.tile .ts{font-size:12px;}
.tile .arch-no{font-size:10px; opacity:.72;}
.tile .td .n{font-size:26px;}
.tile .pill.lite{background:var(--surface-warm); color:var(--ink2); border:1px solid var(--line2); font-weight:500;}
.tile .pill.lite::before{background:var(--line2);}
.tile .pill.lite.tier-1::before{background:var(--t1);} .tile .pill.lite.tier-2::before{background:var(--t2);}
.tile .pill.lite.tier-3::before{background:var(--t3);} .tile .pill.lite.tier-4::before{background:var(--t4);}
.tile .pill.lite.tier-5::before{background:var(--t5);} .tile .pill.lite.tier-6::before{background:var(--t6);}
/* C2：缺档卡补齐区——占位不留白，给明确入口 */
.tile-miss{display:block; margin-top:9px; border:1px dashed var(--line2); border-radius:var(--r-sm); background:var(--surface-warm);
  padding:10px 12px; font-size:12.5px; color:var(--ink2); line-height:1.55; text-align:left;}
.tile-miss .tm-t{font-weight:700; color:var(--ink); font-size:13px;}
.tile-fix{display:inline-block; margin-top:6px; font-size:12.5px; font-weight:700; color:var(--action);
  border-bottom:1.5px solid var(--action-line); padding-bottom:1px; cursor:pointer;}
/* C3：档案卡时间进度条——两端标注起算/到期，避免误读为成功率 */
.tile-meter{display:block; margin-top:9px;}
.tile-meter .meter{display:block; margin-top:0;}
.tile-meter-l{display:flex; justify-content:space-between; gap:8px; margin-top:4px;
  font-size:10.5px; color:var(--ink3); font-variant-numeric:tabular-nums;}
/* P0：信息不全时结论卡的时间线位置改放补齐提示 */
.cc-tl-miss{margin-top:15px; position:relative; z-index:1; border:1px dashed rgba(200,169,106,.55); border-radius:var(--r-sm);
  padding:9px 12px; font-size:12.5px; color:var(--on-dark2); background:rgba(255,252,246,.05);}
/* B：移动端首屏压缩（GPT 给定数值）＋统计条 6 列网格第二排居中＋结论卡眉题分行 */
@media (max-width:560px){
  .hero{padding:11px 16px 12px;}
  .hero h2{font-size:22px; line-height:1.3;}
  .hero p{font-size:12.5px; line-height:1.5;}
  .hero .h-actions{margin-top:9px;}
  .hero .h-meta{font-size:10px;}
  .hero .h-eyebrow{margin-bottom:5px;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important;}

/* ---------- V2.1 支付宝生态适配：手机端底部固定导航 ----------
   同一套 nav.tabs 节点在窄屏下沉到底部（入口与选中态与顶部导航完全一致，
   switchView 的 .active 同步天然生效，零 JS 改动）；桌面仍用顶部导航。 */
@media (max-width:760px){
  nav.tabs{position:fixed; top:auto; bottom:0; left:0; right:0; z-index:45;
    border-bottom:0; border-top:1px solid var(--line);
    background:rgba(255,255,255,.97); box-shadow:0 -4px 16px rgba(31,35,41,.06);
    padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs .tabs-in{padding:4px 10px;}
  nav.tabs button{position:relative; flex-direction:column; gap:2px; min-height:56px;
    padding:4px 0; font-size:11px; border-radius:10px;}
  nav.tabs button .ic{width:21px; height:21px;}
  nav.tabs button .badge{position:absolute; top:2px; right:10px;}
  main{padding-bottom:136px;}
  .chat-input{bottom:calc(72px + env(safe-area-inset-bottom));}
}

/* ---------- V2.1 原生 App 感（Ant Design Mini / 支付宝服务应用观感） ----------
   原则：固定栏与滚动区分离、操作都有按压态、列表即单元格、桌面呈应用窗口。 */
/* 交互件禁文本选中/长按呼出，贴近原生控件手感 */
nav.tabs button,.btn,.chip,.tile,.quick,.risk-row,.statbar .sb.act,.pending-cell{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
/* 明确的按压态反馈（不靠 hover 显形） */
.btn.primary:active{background:var(--action-deep); border-color:var(--action-deep);}
.btn:active{background:var(--action-soft);}
.btn.ghost:active{background:#E2E8F2;}
button.btn[onclick^="delProduct"]:active, button.btn[onclick^="removeEvidence"]:active{background:var(--bad-soft);}
nav.tabs button:active{background:#E2E8F2;}
.btn:active{transform:scale(.98); filter:brightness(.96);}
.tile:active{background:#F0F3F6;}
.quick:active{background:var(--action-soft);}
.risk-row:active{background:#F0F3F6;}
.chip:active{background:var(--action-soft);}
/* 单一滚动区：页面级滚动不与内层抢夺，回弹收敛 */
html{overscroll-behavior-y:contain;}
body{-webkit-overflow-scrolling:touch;}
/* 原生单元格：待处理行带右箭头，暗示可点进 */
.risk-row::after{content:"›"; flex:none; font-size:22px; line-height:1; color:var(--ink3); margin-left:2px;}
/* 详情键值表改原生分组单元格：实线发丝分割、行距拉开 */
table.kv td{padding:9px 6px; border-bottom:1px solid var(--line);}
/* 移动端：表单控件 16px 防 iOS 聚焦自动放大（网页味来源之一） */
@media (max-width:760px){
  .frow input,.frow select,.frow textarea,.chat-input input,
  .toolbar input[type=search],.toolbar select{font-size:16px;}
  /* 首屏品牌卡文案收成应用式短句呈现，不铺文档式长段 */
  .hero p{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .hero .h-demo-note{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
}
/* 档案浏览＝紧凑 List Cell（任务书）：整组一张白底分组表，行间只用分割线，不用大卡大投影 */
#prodList{display:block; background:#fff; border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--sh-card); overflow:hidden;}
#prodList .tile{border:0; border-bottom:1px solid var(--line); border-radius:0; box-shadow:none; padding:12px 14px;}
#prodList .tile:last-child{border-bottom:0;}
#prodList .tile:hover{transform:none; box-shadow:none;}
#prodList .cat-ic{width:40px; height:40px; border-radius:10px;}
#prodList .cat-ic .ic{width:23px; height:23px;}
#prodList .tile .td .n{font-size:20px;}
#prodList:has(.empty){background:transparent; border:0; box-shadow:none; overflow:visible;}
/* Toast（任务书：保存成功/失败要有明确反馈） */
.app-toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:80;
  transform:translate(-50%,8px); background:rgba(31,35,41,.93); color:#fff; font-size:13.5px;
  padding:10px 18px; border-radius:10px; opacity:0; pointer-events:none; max-width:86vw; text-align:center;
  transition:opacity .18s ease,transform .18s ease;}
.app-toast.show{opacity:1; transform:translate(-50%,0);}
/* 桌面应用壳（任务书 P1 基础版）：顶部工具栏 56px＋左侧导航 216px＋主工作区 max-width 1240px */
@media (min-width:1200px){
  body{background:#E8ECF1; display:grid; grid-template-columns:216px minmax(0,1fr); grid-template-rows:auto 1fr;}
  header.site{grid-column:1/-1; position:sticky; top:0; z-index:50;}
  nav.tabs{grid-column:1; grid-row:2; position:sticky; top:56px; height:calc(100dvh - 56px); align-self:start;
    background:#fff; border-bottom:0; border-right:1px solid var(--line); z-index:40;}
  nav.tabs .tabs-in{flex-direction:column; align-items:stretch; gap:4px; padding:14px 10px; max-width:none;}
  nav.tabs button{justify-content:flex-start; padding:0 12px;}
  main{grid-column:2; grid-row:2; width:100%; justify-self:center; background:var(--paper);
    min-height:calc(100dvh - 56px); box-shadow:0 0 32px rgba(31,35,41,.08);}
}

/* ---------- V2.3 视觉收尾（GPT 严苛复审清单四批） ---------- */
/* 第一批/第三批：演示切换文字链接，单独置放于建档组下方，不与主/次按钮同组 */
.demo-switch{margin:-4px 0 12px; padding:0 2px;}
.text-link{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:8px 6px;
  background:transparent; border:0; color:var(--action); font-size:13.5px; font-weight:500; cursor:pointer;}
.text-link:hover{text-decoration:underline; text-underline-offset:3px;}
.text-link:active{transform:scale(.98);}
/* 第四批：Hero「退出演示模式」降为轻量文字按钮（深色面上，保留 DEMO MODE 标识与演示说明） */
.hero .h-text-btn{display:inline-flex; align-items:center; min-height:44px; padding:8px 6px;
  background:transparent; border:0; color:var(--on-dark2); font-size:13.5px; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; text-decoration-color:rgba(217,198,165,.45);}
.hero .h-text-btn:hover{color:var(--on-dark);}
.hero .h-text-btn:active{transform:scale(.98);}
/* 第二批：结论卡操作按钮统一——主按钮独占一行，次按钮第二行并排；统一高 44px、圆角 10px */
.concl-btns{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.concl-btns .cb-row{display:flex; gap:8px;}
.concl-btns .btn{flex:1 1 0; min-height:44px; border-radius:10px; font-size:13.5px; padding:8px 6px; gap:5px;}
.concl-btns .btn .ic{width:15px; height:15px;}
/* 次行三钮并排：窄屏收字号＋禁折行，保证统一 44px 高不被长文案撑高（390/360/320 实测无溢出） */
.concl-btns .cb-row.sub .btn{font-size:12px; white-space:nowrap;}
.concl-btns .cb-pkg{background:#fff; border-color:var(--action); color:var(--action);}
.concl-btns .cb-sec{background:var(--surface-warm); border-color:var(--line); color:var(--ink2);}
.concl-btns .cb-sec:hover{background:#EEF1F5; color:var(--ink);}
/* 评委动线猎杀 P0-1：对话气泡内嵌结论卡比整页卡窄——按钮行作为纵向 flex 子项会被
   nowrap 按钮的 min-content（约 250px）顶出卡片右界。只在气泡内放行换行＋取消行级
   最小宽度，按钮保持自然宽度、放不下就换行；详情页同卡排版不受影响。 */
.msg .conclusion .concl-btns .cb-row{flex-wrap:wrap; min-width:0;}
/* GPT 终审 P2：气泡内次行三钮统一半行宽——换行后的第三钮不再整行拉满，
   与前两钮同高（44px 由 .concl-btns .btn 的 min-height 保证）、同圆角、同宽、左对齐；
   详情页同卡排版（flex:1 三等分）不受此规则影响。 */
.msg .conclusion .concl-btns .cb-row.sub .btn{flex:0 1 calc(50% - 4px);}
/* 第二批：证据结构化呈现——字段行与「查看完整记录」展开区（核验记录/证据材料共用） */
.chk-block{border-top:1px dashed var(--line); padding:10px 0 4px;}
.chk-block:first-of-type{border-top:0; padding-top:2px;}
.chk-facts{border-top:0; padding:0;}
.fold-body{font-size:13px; color:var(--ink2); line-height:1.7; background:var(--surface-warm);
  border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; margin-top:8px; word-break:break-word;}
/* 第三批：档案墙条目精修——商品图 44×44 统一容器（底 #F1F3F5、圆角、contain、内边距），首页与档案页同一套 */
.tile-thumb{width:44px; height:44px; border-radius:10px; flex:none; background:#F1F3F5;
  display:grid; place-items:center; overflow:hidden;}
.tile-thumb .tile-photo, #prodList .tile-thumb .tile-photo{width:100%; height:100%; display:block;
  object-fit:contain; padding:3px; background:transparent; border-radius:0;}
.tile-thumb .cat-ic, #prodList .tile-thumb .cat-ic{width:100%; height:100%; background:transparent;
  box-shadow:none; border-radius:0;}
.tile-thumb .cat-ic .ic, #prodList .tile-thumb .cat-ic .ic{width:25px; height:25px;}
.tile .tn{font-size:16px; font-weight:600;}
.tile .td .n{font-size:20px; font-weight:650;}
#prodList .tile{padding:15px 14px;}
.meter{height:5px;}
.tile .pill{height:22px; padding-top:0; padding-bottom:0;}
/* 第三批：演示数据徽标弱化——更淡的暖米色、10.5px，全站统一（.demo-tag 单点定义） */
.demo-tag{background:#F8F1DF; color:#93763A; font-size:10.5px; font-weight:500; padding:1px 7px; border-radius:5px;}
/* 第四批：风险清单右侧信息组（数字＋单位＋状态统一右对齐）＋箭头间距微调 */
.risk-row .rd{display:flex; flex-direction:column; align-items:flex-end; gap:1px;}
.risk-row .rd-n{display:flex; align-items:baseline; gap:3px;}
.risk-row .rd-n .n{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
.risk-row .rd-n .u{font-size:11.5px; color:var(--ink2);}
.risk-row .rd-s{font-size:11.5px; font-weight:600; line-height:1.3;}
.risk-row::after{margin-left:6px;}
/* 第四批：结论卡时间线「今天」标签蓝色强调（只改颜色，不动防撞布局与字重） */
.cc-tl-labels .mid{color:#79B8FF;}

/* ---------- V2.3 对话页布局修复＋语音输入（杨宇真机报障：空态时输入框悬在页面中部） ----------
   对话视图改纵向弹性布局：消息区占满剩余高度独立滚动，快捷问与输入框恒贴视图底部；
   视图高度按断点扣除顶栏/底栏占用，键盘弹起时由 fitChatHeight() 按 visualViewport 动态收紧。
   main 底内边距在对话页让位（:has），避免整页多出一截可滚空白。只动布局，不动配色与视觉。 */
#view-chat.active{display:flex; flex-direction:column; height:calc(100dvh - 133px);}
main:has(> #view-chat.active){padding-bottom:0;}
#view-chat #chatLog{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; scrollbar-width:thin;}
#view-chat .chips{flex:none;}
#view-chat .chat-input{position:relative; bottom:auto; flex:none; margin-bottom:12px;}
@media (max-width:760px){
  #view-chat.active{height:calc(100dvh - 136px - env(safe-area-inset-bottom));}
  #view-chat .chat-input{margin-bottom:8px;}
}
@media (min-width:1200px){
  #view-chat.active{height:calc(100dvh - 72px);}
}
/* 输入框左内边距让位麦克风按钮：按钮隐藏时文字起点与旧版一致（5+11=16px） */
.chat-input{padding-left:5px;}
.chat-input input{padding-left:11px;}
/* 麦克风幽灵按钮：与顶栏设置键同一语言（透明底、灰图标、按压缩放）；识别中红底呼吸光圈示忙 */
.mic-btn{width:44px; height:44px; border-radius:12px; border:0; flex:none; place-items:center;
  background:transparent; color:#66717F; cursor:pointer; transition:background .15s,color .15s,transform .1s;}
.mic-btn:hover{background:var(--action-soft); color:var(--action);}
.mic-btn:active{transform:scale(.93);}
.mic-btn .ic{width:20px; height:20px;}
.mic-btn.rec{background:var(--bad); color:#fff; animation:micPulse 1.3s ease-in-out infinite;}
.mic-btn.rec:hover{background:var(--bad); color:#fff;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(185,67,53,.35);} 50%{box-shadow:0 0 0 7px rgba(185,67,53,0);}}
/* ---------- Bug2 横向漂移锁（2026-11-27 杨宇真机反馈：弹窗/页面能被手指横向拖着来回漂移） ----------
   实测定位：Chromium 与 WebKit(MiniBrowser) 在 390/375 下逐个开弹窗量过——静态布局零横向溢出
   （scrollWidth 恒等于 innerWidth、无越界元素），漂移来自触摸手势层：横向拖动被滚动容器/页面
   转成了平移与橡皮筋回弹。三重锁：
   ① 根层 overflow-x:clip —— 裁掉任何横向溢出；clip 不生成滚动容器，不伤 sticky 与 window 滚动；
   ② touch-action 只放行纵向平移＋捏合缩放 —— 横向手指拖动不再被转成平移；纵向滚动照常。
      手势判定只走到「实际滚动的元素」为止：快捷条等自有横向滚动容器不受影响；
   ③ overscroll-behavior 断开横向过滚链，杜绝回弹漂移。
   弹窗层再叠 overflow-x:hidden 与子项收缩兜底，长串（链接/编号）允许断行。 */
html{overflow-x:clip; overscroll-behavior-x:none;}
body{overflow-x:clip; touch-action:pan-y pinch-zoom;}
#chatLog{touch-action:pan-y pinch-zoom;}
.modal-mask{overflow-x:hidden; overscroll-behavior:contain; touch-action:pan-y pinch-zoom;}
.modal{max-width:100%; overflow-x:hidden; touch-action:pan-y pinch-zoom;}
.modal .frow,.modal .grid2>*{min-width:0;}
.modal img{max-width:100%;}
.hint,.warnbox{overflow-wrap:break-word;}
</style>

<script>
/* ================= CORE LOGIC START（纯函数，可独立测试） ================= */
const RULE_VERSION = 'v1.5';
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowStr(){ const d=new Date(); return fmtDate(d)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
/* 严格日期校验（v1.3，GPT 复审）：必须 YYYY-MM-DD 零填充格式，且是真实日历日期——
   2025-02-31、2025-13-01 一律无效，不许 JS Date 自动进位蒙混过关。 */
function isValidDateStr(s){
  if(!s || typeof s!=='string') return false;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.trim());
  if(!m) return false;
  const y=+m[1], mo=+m[2], d=+m[3];
  if(mo<1 || mo>12 || d<1 || d>31) return false;
  const dt = new Date(y, mo-1, d);
  return dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d;
}
function parseDate(s){ if(!isValidDateStr(s)) return null; const p=String(s).trim().split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
/* 日期合理区间（终检猎杀）：真实事件日期不能晚于今天、不能早于 1970-01-01。
   起算依据可落在购买/发票/激活任一日期上——只拦购买日期会留侧门（发票日填 2999 同样算出天文数字结论）。 */
function dateOutOfRange(s){ return !!s && isValidDateStr(s) && (s < '1970-01-01' || s > todayStr()); }
/* 月数严格校验（v1.3）：保修月数必须为正整数，延保月数为非负整数，1.5 个月这种输入直接判无效。
   终检猎杀补上限：月数 >1200（100 年）一律判无效——超长月数会把到期年算成 5 位数，
   严格日期格式拒收后天数退化成与真实日期无关的垃圾值（实测「已过保 20784 天」），
   或算出数十万天级天文数字；真实保修无此量级。 */
function isPosIntMonths(v){ if(v===''||v===null||v===undefined) return false; const n=Number(v); return Number.isInteger(n) && n>0 && n<=1200; }
function isNonNegIntMonths(v){ if(v===''||v===null||v===undefined) return false; const n=Number(v); return Number.isInteger(n) && n>=0 && n<=1200; /* 上限同 isPosIntMonths：延保叠加同样能算出 5 位年份与垃圾天数 */ }
/* 商品数据体检：分清「缺失」（补齐即可）与「无效」（填了但不合法，必须修正）。
   无效数据 → 信息不全/待修正，不许继续出正式结论（v1.3）。 */
function productDataIssues(product){
  const missing = [], invalid = [];
  [['purchase_date','购买日期'],['invoice_date','发票日期'],['activation_date','激活日期']].forEach(([k,label])=>{
    const v = product[k];
    if(v!=='' && v!==null && v!==undefined && !isValidDateStr(v)) invalid.push(label+'「'+v+'」不是真实日期');
  });
  if(!startDateOf(product) && !invalid.length) missing.push('起算日期');
  const w = product.warranty_months_whole;
  if(w===''||w===null||w===undefined) missing.push('整机保修月数');
  else if(!isPosIntMonths(w)) invalid.push('整机保修月数「'+w+'」必须为正整数');
  const pm = product.warranty_months_parts;
  if(pm!==''&&pm!==null&&pm!==undefined && !isPosIntMonths(pm)) invalid.push('主要部件保修月数「'+pm+'」必须为正整数');
  const em = product.extended_months;
  if(em!==''&&em!==null&&em!==undefined && !isNonNegIntMonths(em)) invalid.push('延保月数「'+em+'」必须为非负整数');
  return { missing, invalid };
}
/* 有效凭证（v1.4 去回退，GPT 四审 P0-01）：只认 evidence_record 本身——
   kind==='vision'（真实 AI 识别建档）或 kind==='upload'（用户真实上传凭证文件）。
   v1.3 的 source==='凭证识别' 回退已删除：流程名字不算证据，模拟识别/预设数据
   靠 source 标记一律无证据资格；纯手填 evidence_desc 同样不算。
   v1.5：记录被打上 invalid（存证文件在 IndexedDB 中已不存在）时视为无证据。 */
function hasEvidence(product){
  if(!product) return false;
  const r = product.evidence_record;
  return !!(r && (r.kind==='vision' || r.kind==='upload') && !r.invalid);
}
/* 内容哈希（v1.5，GPT 终审 P0-03/P0-04）：SHA-256 十六进制摘要。
   纯函数（只依赖入参＋WebCrypto），证据存证与单测共用同一份实现。 */
async function sha256Hex(data){
  let buf;
  if(data instanceof ArrayBuffer) buf = data;
  else if(ArrayBuffer.isView(data)) buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
  else throw new Error('sha256Hex 需要 ArrayBuffer 或 TypedArray 入参');
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* 证据记录构造（v1.5）：缺 file_id 或 sha256 一律返回 null——
   没有真实存证（IndexedDB 写入成功＋内容哈希）就不许生成证据记录。 */
function buildUploadRecord(meta){
  if(!meta || !meta.file_id || !meta.sha256) return null;
  return { kind:'upload', file_id:meta.file_id, name:meta.name||'', type:meta.type||'', size:meta.size||0, sha256:meta.sha256, at:meta.at||'' };
}
function buildVisionRecord(meta){
  if(!meta || !meta.file_id || !meta.sha256) return null;
  return { kind:'vision', file_id:meta.file_id, sha256:meta.sha256, at:meta.at||'', model:meta.model||'',
    raw_text:meta.raw_text||'', fields_raw:meta.fields_raw||{}, fields_final:meta.fields_final||{}, fields_edited:meta.fields_edited||[] };
}
/* 用户确认时改过哪些字段（v1.5）：识别原值 vs 用户确认终值逐项比对；
   宽松比较——数字与同值字符串视为未改（如 12 与 '12'），空串与 null/undefined 视为未改。 */
function diffEditedFields(fieldsRaw, fieldsFinal){
  const norm = v => (v===null || v===undefined) ? '' : String(v);
  const raw = fieldsRaw||{}, fin = fieldsFinal||{};
  const keys = new Set([...Object.keys(raw), ...Object.keys(fin)]);
  const edited = [];
  keys.forEach(k=>{ if(norm(raw[k]) !== norm(fin[k])) edited.push(k); });
  return edited;
}
/* 证据引用失效标记（v1.5）：evidence_record.file_id 不在存证库现有 key 集合里
   （被浏览器清理/损坏）→ 给记录打 invalid，hasEvidence 随即视为无证据、档位自动回落。
   纯函数：只改入参 products 并返回本次新失效条数；应用层启动时拿 IndexedDB 实际 key 集合调用，
   规则函数本身不碰 IndexedDB、保持同步纯净。 */
function markInvalidEvidenceRefs(products, existingIds){
  const set = existingIds instanceof Set ? existingIds : new Set(existingIds||[]);
  let n = 0;
  (products||[]).forEach(p=>{ const r = p && p.evidence_record; if(r && r.file_id && !set.has(r.file_id) && !r.invalid){ r.invalid = true; n++; } });
  return n;
}
/* 内容哈希复验（v2.3 查杀⑥，GPT 四审维护项 #2）：存证文件还在、但实际内容 SHA-256 与建档时记录的
   对不上（文件被替换/损坏）→ 这条证据同样不可信。纯函数：actualHashById 只放成功读到的文件，
   读不到的文件不在表里、不在此误判（缺失由 markInvalidEvidenceRefs 处理）；返回应打 invalid 的档案 id 清单。 */
function evidenceHashMismatches(products, actualHashById){
  const out = [];
  (products||[]).forEach(p=>{
    const r = p && p.evidence_record;
    if(!r || !r.file_id || !r.sha256 || r.invalid) return;
    const actual = actualHashById ? actualHashById[r.file_id] : undefined;
    if(actual && actual !== r.sha256) out.push(p.id);
  });
  return out;
}
/* 存证引用全集（v2.3 查杀⑥）：档案的证据记录（含已失效的——失效记录的原图仍供用户查看/清除，不算孤儿）
   与商品照片引用的 file_id 全集。孤儿 = 存证库里存在、却不在这个集合里的文件
   （识别中途放弃、选了文件又没保存档案时，先行落库的那一份）。 */
function referencedFileIds(products){
  const set = new Set();
  (products||[]).forEach(p=>{ if(!p) return;
    if(p.evidence_record && p.evidence_record.file_id) set.add(p.evidence_record.file_id);
    if(p.photo_file_id) set.add(p.photo_file_id);
  });
  return set;
}
function findOrphanFileIds(products, existingIds){
  const refs = referencedFileIds(products);
  return (existingIds||[]).filter(id=> !refs.has(id));
}
/* 双窗口三方合并（v2.3 查杀①）：两个窗口各攥一份内存快照、轮流整库写盘时，后写会吞掉先写者的
   新增/修改（整库 JSON 覆盖）。save() 察觉外部写入后以「共同基线 / 本窗口 / 另一窗口」三方按实体 id 合并：
   一方没改的取另一方改的；一方删了、另一方没改 → 尊重删除；一方删了、另一方改了 → 保修改（防丢数据优先）；
   双方都改了同一条 → 本窗口（正在保存的一方）为准。chat 无 id：一方没动取另一方，双方都动则并集去重。纯函数。 */
function mergeStoreStates(base, mine, theirs){
  const B = base||{}, M = mine||{}, T = theirs||{};
  const eq = (a,b)=> JSON.stringify(a)===JSON.stringify(b);
  const byIdMap = arr=>{ const m = new Map(); (arr||[]).forEach(x=>{ if(x && x.id) m.set(x.id, x); }); return m; };
  const out = {};
  ['products','repairs','reminders','policyChecks','replacements','partEvents'].forEach(col=>{
    const bM = byIdMap(B[col]), mM = byIdMap(M[col]), tM = byIdMap(T[col]);
    const picked = new Map();
    new Set([...bM.keys(), ...mM.keys(), ...tM.keys()]).forEach(id=>{
      const b = bM.get(id), m = mM.get(id), t = tM.get(id);
      if(m && t){
        if(b && eq(m,b) && !eq(t,b)) picked.set(id, t);
        else picked.set(id, m);
      } else if(m && !t){
        if(!b || !eq(m,b)) picked.set(id, m);
      } else if(!m && t){
        if(!b || !eq(t,b)) picked.set(id, t);
      }
    });
    const ordered = [];
    (M[col]||[]).forEach(x=>{ if(x && x.id && picked.has(x.id)){ ordered.push(picked.get(x.id)); picked.delete(x.id); } });
    (T[col]||[]).forEach(x=>{ if(x && x.id && picked.has(x.id)){ ordered.push(picked.get(x.id)); picked.delete(x.id); } });
    (M[col]||[]).forEach(x=>{ if(x && !x.id) ordered.push(x); });
    out[col] = ordered;
  });
  const bc = B.chat||[], mc = M.chat||[], tc = T.chat||[];
  if(eq(mc,bc)) out.chat = tc.slice();
  else if(eq(tc,bc)) out.chat = mc.slice();
  else { const seen = new Set(mc.map(x=> JSON.stringify(x))); out.chat = mc.concat(tc.filter(x=> !seen.has(JSON.stringify(x)))); }
  return out;
}
/* 品牌官方域名清单（v1.3）：用户粘贴的官方链接必须命中本品牌官方域名（含子域名）才可能算官方留痕。 */
const OFFICIAL_DOMAINS = {
  '海尔':['haier.com'], '美的':['midea.com.cn','midea.com'], '格力':['gree.com'],
  '小米':['mi.com'], '华为':['huawei.com'], '戴森':['dyson.cn','dyson.com'],
  '苹果':['apple.com'], '三星':['samsung.com.cn','samsung.com'], '西门子':['bsh-group.cn','siemens-home.bsh-group.cn'],
  '松下':['panasonic.cn','panasonic.com'], '索尼':['sony.com.cn','sony.com'], 'LG':['lg.com']
};
function isOfficialUrl(url, brand){
  if(!url || !brand) return false;
  const domains = OFFICIAL_DOMAINS[brand]; if(!domains) return false;
  const m = /^https?:\/\/([^/?#\\]+)/i.exec(String(url).trim());
  if(!m) return false;

    const spans = box.querySelectorAll('span');
    if(spans.length !== 3) return;

    mid.classList.remove('st-row2');

    const crowded = r1.left < r0.right + GAP || r1.right > r2.left - GAP || r1.left < bx.left || r1.right > bx.right;

  if(product.evidence_record && product.evidence_record.kind==='vision'){

    chain.push({date:(vr.at||'').slice(0,10), label:'AI 识别存证 · 模型 '+(vr.model||'—')+' · '+(vr.at||'')+((vr.fields_edited && vr.fields_edited.length) ? ' · 用户确认时修改字段：'+vr.fields_edited.join('、') : ' · 用户未修改识别字段')+' · 识别原文与原图见详情页证据材料'+(vr.invalid ? ' · 该记录已失效（存证文件不存在）' : '')});

  checks.forEach(c=> chain.push({date:(c.submitted_at||'').slice(0,10), label:'政策核验（'+checkTraceLevel(c, product)+'）· '+c.source_desc+' · 查得：'+c.warranty_months_found+(c.user_confirmed?' · 用户声明已查阅官方页面':' · 未声明查阅官方页面')+(c.submitted_at?' · 提交于 '+c.submitted_at:' · 历史记录，缺少用户提交时间，待补录')}));
  (ctx.replacements||[]).filter(e=>e.product_id===product.id).forEach(e=> chain.push({date:e.event_date||'', label:'换新事件 · '+e.warranty_reset+(e.new_serial_no?' · 新序列号 '+e.new_serial_no:'')}));
  (ctx.partEvents||[]).filter(e=>e.product_id===product.id).forEach(e=> chain.push({date:e.start_date||'', label:'部件事件 · '+(e.part_name||'部件')+'（'+e.event_type+'）'+(validPartEvent(e, product)?'':' · 未参与计算（数据不合法）')}));
  (product.correction_log||[]).forEach(c=> chain.push({date:c.at||'', label:'用户纠正 · '+c.field+'：'+c.old_value+' → '+c.new_value}));
  chain.push({date: today, label:'结论生成 · 规则 '+RULE_VERSION+' · 档位 '+tier+' '+TIER_LABEL[tier]});
  chain.sort((a,b)=> (a.date||'') < (b.date||'') ? -1 : 1);
  return {
    tier, tierLabel: TIER_LABEL[tier], tierDesc: TIER_DESC[tier], strength,
    status: w.status, endWhole: w.endWhole, endParts: w.endParts,
    daysWhole: w.daysWhole, daysParts: w.daysParts,
    startWhole: w.startWhole, startParts: w.startParts,
    basis: basisParts.join('；') || '信息不足，无法给出计算依据',
    fixReasons: w.invalidReasons || [],
    evidence: evidence.join('；'),
    unverified: unverified.length ? unverified.join('；') : '无',
    actions, generatedAt: today, ruleVersion: RULE_VERSION,
    corrections: corrections.length ? corrections.join('；') : '无',
    risks, chain
  };
}

const LS_KEY = 'warrantyButler.v1';

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function parseStoreJSON(raw){ if(!raw) return null; try{ const s = JSON.parse(raw); if(s && s.products) return s; }catch(e){} return null; }

   直接整库覆盖会吞掉对方的数据，必须先三方合并（mergeStoreStates）再写。 */
let lastPersistedJSON = lsGet(LS_KEY);
let saveFailNotified = false;
let lastSaveOk = true; /* 最近一次落盘是否成功：toast() 据此禁止在落盘失败时报喜（见 toast 的 V2.3 闸门） */
function save(){
  if(demoMode) return true;

    const cur = lsGet(LS_KEY);
    if(cur && lastPersistedJSON && cur !== lastPersistedJSON){
      const theirs = parseStoreJSON(cur);
      if(theirs) store = mergeStoreStates(parseStoreJSON(lastPersistedJSON) || emptyStore(), store, theirs);
    }
    const out = JSON.stringify(store);
    if(cur && cur !== out && parseStoreJSON(cur)){ try{ localStorage.setItem(LS_BAK_KEY, cur); }catch(e){} }
    localStorage.setItem(LS_KEY, out);
    lastPersistedJSON = out;
    saveFailNotified = false;
    lastSaveOk = true;
    return true;
  }catch(e){
    /* V2.3 查杀①：配额满/存储被禁用时旧实现会把异常抛进点击处理（页面报错、流程中断且无提示）。

    lastSaveOk = false;

if(typeof window !== 'undefined' && typeof window.addEventListener === 'function'){

      const theirs = parseStoreJSON(cur); if(!theirs) return;

/* ================= 证据文件存证（IndexedDB，v1.5 · GPT 终审 P0-03/P0-04） =================
   凭证原文件/识别原图只存本机 IndexedDB（库 warrantyButlerFiles / store files，key=file_id），
   档案里只留引用（file_id＋SHA-256＋元数据）。写入成功才许生成证据记录；
   启动时校验引用：file_id 在库中不存在 → 记录打 invalid，结论按无凭证回落。 */
const IDB_NAME = 'warrantyButlerFiles';
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(typeof indexedDB==='undefined') return reject(new Error('当前浏览器不支持 IndexedDB'));
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ return reject(e); }
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains('files')) req.result.createObjectStore('files'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error || new Error('IndexedDB 打开失败'));
  });
}
async function idbPutFile(id, blob){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(blob, id);
    tx.oncomplete = ()=>{ db.close(); resolve(true); };
    tx.onerror = ()=>{ db.close(); reject(tx.error || new Error('凭证写入失败')); };
    tx.onabort = ()=>{ db.close(); reject(new Error('凭证写入被中断')); };
  });
}
async function idbGetFile(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const rq = db.transaction('files', 'readonly').objectStore('files').get(id);
    rq.onsuccess = ()=>{ db.close(); resolve(rq.result || null); };
    rq.onerror = ()=>{ db.close(); reject(rq.error || new Error('凭证读取失败')); };
  });
}
async function idbDeleteFile(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').delete(id);
    tx.oncomplete = ()=>{ db.close(); resolve(true); };
    tx.onerror = ()=>{ db.close(); reject(tx.error || new Error('凭证删除失败')); };
  });
}
/* V2.1 任务书·坑 3：删存证前查引用——同一 file_id 仍被其他档案的有效证据记录引用时不删，
   防共享文件被一处删除误删（只查引用，不改存储与哈希逻辑本身）。 */
function fileStillReferenced(fid, exceptPid){
  return store.products.some(p=> p.id!==exceptPid && p.evidence_record && p.evidence_record.file_id===fid && !p.evidence_record.invalid);
}
/* V2.3 查杀①：删 Blob 的统一闸门——同一 file_id 无论被当作证据还是商品照片引用着，任一引用还在都不许删。
   旧口径证据删除点只查证据引用（fileStillReferenced）、照片删除点查双引用（photoStillReferenced），不对称：
   跨角色共享同一文件时，删证据会把别人还在用的照片文件删掉（对方回退占位、证据链也断）。统一走这道闸。 */
function fileSafeToDelete(fid, exceptPid){
  return !!fid && !fileStillReferenced(fid, exceptPid) && !photoStillReferenced(fid, exceptPid);
}
/* V2.2 商品照片：与凭证存证共用 IndexedDB 文件层（persistEvidenceFile / idbGetFile / idbDeleteFile），
   档案只存 photo_file_id 引用。删照片 Blob 前查引用（照片引用＋证据引用都算），防共享文件误删。 */
function photoStillReferenced(fid, exceptPid){
  return store.products.some(p=> p.id!==exceptPid && ((p.photo_file_id===fid && !p.photo_invalid) || (p.evidence_record && p.evidence_record.file_id===fid && !p.evidence_record.invalid)));
}
const photoURLCache = {};
const BLANK_IMG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
/* 渲染后回填商品照片（卡片/详情的 img[data-photofid]）：缓存命中直接用；
   Blob 已不存在（被浏览器清理）→ 标记 photo_invalid、回退类目图标占位并重渲染；
   存证库不可用（抛错）时不误判失效，保留占位待下次——与证据引用校验同一口径。 */
async function hydratePhotos(root){
  const scope = root || document;
  if(!scope || !scope.querySelectorAll) return;
  const imgs = scope.querySelectorAll('img[data-photofid]');
  for(const img of imgs){
    const fid = img.getAttribute('data-photofid');
    if(!fid) continue;
    if(photoURLCache[fid]){ img.src = photoURLCache[fid]; continue; }
    try{
      const blob = await idbGetFile(fid);
      if(blob && (blob.type||'').indexOf('image/')===0){
        const url = URL.createObjectURL(blob);
        photoURLCache[fid] = url; img.src = url;
      } else if(!blob){
        let changed = false;
        store.products.forEach(p=>{ if(p.photo_file_id===fid && !p.photo_invalid){ p.photo_invalid = true; changed = true; } });
        if(changed){ save(); renderAll();
          const dw = document.getElementById('archiveDetailWrap');
          if(currentDetail && dw && dw.style.display!=='none') openDetail(currentDetail);
          return; }
      }
    }catch(e){ /* 存证库不可用：跳过本轮回填，不动档案 */ }
  }
}
async function idbAllFileIds(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{

    rq.onsuccess = ()=>{ db.close(); resolve(rq.result || []); };

   调用方据此不生成证据记录、不升档（P0-03 硬规矩）。 */
async function persistEvidenceFile(file){
  if(!file) throw new Error('没有可存证的文件');
  const buf = await file.arrayBuffer();
  const sha256 = await sha256Hex(buf);
  const file_id = 'f' + uid();
  await idbPutFile(file_id, file);
  return { file_id, sha256 };
}
/* 启动校验：拿 IndexedDB 实际 key 集合核对每条证据引用，对不上的打 invalid 并重渲染。
   存证库本身不可用（打开失败）时不臆断失效，保持现状——宁可暂不降档，不误杀证据。 */
async function validateEvidenceRefs(){

/* V2.3 查杀⑥（GPT 四审维护项 #2）：内容哈希复验——引用还在不等于内容没坏。逐份读回存证 Blob 重算
   SHA-256，与建档时记录的比对；对不上的打 invalid，与「文件已不存在」走同一条失效呈现与档位回落路径，
   绝不拿内容对不上的文件冒充证据。商品照片没有记录内容哈希，不在本项范围（其失效走 hydratePhotos 的存在性回退）。 */
async function verifyEvidenceContents(){
  const targets = store.products.filter(p=> p.evidence_record && p.evidence_record.file_id && p.evidence_record.sha256 && !p.evidence_record.invalid);
  if(!targets.length) return 0;
  const actual = {};
  for(const p of targets){
    const blob = await idbGetFile(p.evidence_record.file_id);
    if(!blob) continue; /* 读不到 = 不存在，归 validateEvidenceRefs 的存在性口径处理 */
    actual[p.evidence_record.file_id] = await sha256Hex(await blob.arrayBuffer());
  }
  const bad = evidenceHashMismatches(store.products, actual);
  bad.forEach(pid=>{ const p = byId(pid); if(p && p.evidence_record) p.evidence_record.invalid = true; });
  return bad.length;
}
/* V2.3 查杀⑥（GPT 四审维护项 #3）：孤儿 Blob 清理——识别原图在识别开始时就先行落库（v1.5 口径），
   用户中途放弃/重选、或选了凭证/照片文件却没保存档案，那份文件就成了无人引用的孤儿。
   启动时按 referencedFileIds 全集比对存证库实际 key，多出的逐个删除（单个失败不影响其余）。 */
async function sweepOrphanFiles(){
  const ids = await idbAllFileIds();

  for(const fid of orphans){ try{ await idbDeleteFile(fid); }catch(e){} }
  return orphans.length;
}
/* 启动存储审计：① 引用存在性 → ② 内容哈希复验 → ③ 孤儿清理。每步独立隔离，存证库不可用时整步跳过，
   宁可暂不降档/暂不清，也不在情况不明时误杀证据或阻断启动。 */
async function startupStorageAudit(){
  if(demoMode) return;
  await validateEvidenceRefs();
  try{ if((await verifyEvidenceContents()) > 0){ save(); renderAll(); } }catch(e){ /* 存证库不可用：跳过内容复验 */ }
  try{ await sweepOrphanFiles(); }catch(e){ /* 存证库不可用：跳过孤儿清理 */ }
}

/* ---------- 提醒生成（闭环入口） ---------- */
function syncReminders(){
  store.products.forEach(p=>{
    const w = warrantyOf(p);
    const id = 'rem_'+p.id;
    const ex = store.reminders.find(r=>r.id===id);
    if(w.missing || w.daysWhole===null || w.daysWhole>30 || w.daysWhole<-30){ if(ex && ex.state==='待决策') store.reminders = store.reminders.filter(r=>r.id!==id); return; }
    const tier = w.daysWhole>7 ? '30天' : (w.daysWhole>0 ? '7天' : (w.daysWhole===0 ? '当天' : '过保7天'));
    if(!ex) store.reminders.push({id, product_id:p.id, tier, due_date:w.endWhole, state:'待决策', decision:'', defer_reason:'', follow_result:'', follow_log:[]});
    /* 终检猎杀：待决策提醒的到期日也要随档案编辑刷新——此前只刷 tier，编辑购买日期后
       提醒卡会并列显示旧到期日与按新到期算出的剩余天数，自相矛盾 */
    else if(ex.state==='待决策'){ ex.tier = tier; ex.due_date = w.endWhole; }
  });
  save();
}

/* V2.1 任务书：Tab 切换不重载、返回恢复各自滚动位置（详情页由 openDetail 自行回顶） */
/* 程序化定位必须瞬时完成：全局 smooth 会让 scrollTo 变成动画，动画期间照片异步回填改高页面，
   iOS Safari 会中断动画把页面留在底部（2026-11-27 杨宇真机报障：点首页被拉到最底下） */
function jumpTo(y){
  const de = document.documentElement;
  const prev = de.style.scrollBehavior;
  de.style.scrollBehavior = 'auto';
  window.scrollTo(0, y);
  de.style.scrollBehavior = prev;
}
/* 对话页高度贴合：视图高度 = 可视区高度 − 视图顶端占用 − 底部固定标签栏高度。
   CSS 的 dvh 计算是静态基线；键盘弹起时 visualViewport 变小，本函数同步收紧高度，
   输入框始终贴在可视区底部、标签栏上方（桌面/平板标签栏不在底部，reserve 为 0）。 */
function fitChatHeight(){
  try{
    const vv = window.visualViewport;
    if(!vv) return;
    const v = document.getElementById('view-chat');
    if(!v || !v.classList.contains('active')) return;
    const tabs = document.querySelector('nav.tabs');
    let reserve = 0;
    if(tabs && getComputedStyle(tabs).position === 'fixed') reserve = tabs.getBoundingClientRect().height;
    const topInView = v.getBoundingClientRect().top - (vv.offsetTop || 0);
    const h = Math.round(vv.height - topInView - reserve);
    if(h > 240) v.style.height = h + 'px';
  }catch(e){}
}
const scrollMem = {};
let curView = 'home';
function switchView(v){
  scrollMem[curView] = window.scrollY;
  ['home','chat','archive','reminders'].forEach(x=>{
    document.getElementById('view-'+x).classList.toggle('active', x===v);
    const tab = document.getElementById('tab-'+x);
    tab.classList.toggle('active', x===v);
    tab.setAttribute('aria-selected', x===v ? 'true' : 'false');
  });
  if(v==='home') renderHome();
  if(v==='archive'){ document.getElementById('archiveListWrap').style.display=''; document.getElementById('archiveDetailWrap').style.display='none'; renderList(); }
  if(v==='reminders') renderReminders();
  curView = v;
  jumpTo(scrollMem[v] || 0);
  if(v==='chat'){ fitChatHeight(); setTimeout(fitChatHeight, 280); /* viewIn 动画（translateY 5px）结束后再贴合一次，消除测高偏移 */ }
}

function archiveNo(p){
  const key = x => (x.created_at || x.purchase_date || '9999-99-99');
  const ordered = store.products.slice().sort((a,b)=> key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);
  const idx = ordered.findIndex(x=>x.id===p.id);
  const year = String((p.created_at || p.purchase_date || todayStr())).slice(0,4) || '2026';
  return 'HW-' + year + '-' + String((idx<0?0:idx)+1).padStart(4,'0');
}

    + '<div class="quick-grid">'

    + '<button class="quick" onclick="switchView(\'chat\')"><span class="q-ic"><svg class="ic"><use href="#i-chat"/></svg></span><span><span class="q-t">问管家</span><br><span class="q-s">还保修吗，它直接答</span></span></button>'
    + '<button class="quick" onclick="switchView(\'reminders\')"><span class="q-ic"><svg class="ic"><use href="#i-bell"/></svg></span><span><span class="q-t">提醒中心</span><br><span class="q-s">临期处置闭环</span></span></button>'
    + '<button class="quick" onclick="openSettings()"><span class="q-ic"><svg class="ic"><use href="#i-gear"/></svg></span><span><span class="q-t">AI 设置</span><br><span class="q-s">自填 Key · 高级选项</span></span></button>'
    + '</div>';

  hydratePhotos(wrap);

/* ---------- 结论卡渲染 ---------- */
const STATUS_VAR = {'在保':'var(--ok)','临近到期':'var(--warn)','已过保':'var(--bad)','信息不全':'var(--info)'};
const STATUS_CLS = {'在保':'ok','临近到期':'warn','已过保':'bad','信息不全':'info'};
function conclusionCardHTML(p, compact){
  const c = conclOf(p);
  /* 横向保修时间线（V2.1 语义版，GPT P0）：节点顺序随状态切换——
     在保：起算 → 今天 → 到期；已过保：起算 → 到期 → 今天；轴最大值 = max(到期, 今天)。
     信息不全（无起算/到期）不画线，改放补齐提示。 */
  const tl = timelineModel(c.startWhole, c.endWhole, todayStr());
  let tlHtml;
  if(tl){
    tlHtml = '<div class="cc-timeline"><div class="cc-tl-track"><div class="cc-tl-fill" style="width:'+tl.todayPct+'%"></div>'
      + tl.nodes.map(n=>'<span class="cc-tl-dot'+(n.key==='today'?' today':'')+'" data-k="'+n.key+'" style="left:'+n.pct+'%"></span>').join('')
      + '</div><div class="cc-tl-labels">'
      + tl.nodes.map(n=>'<span data-k="'+n.key+'" data-pct="'+n.pct+'"'+(n.key==='today'?' class="mid"':'')+' style="left:'+n.pct+'%">'+n.label+' '+esc(n.date)+'</span>').join('')
      + '</div></div>';
  } else {
    tlHtml = '<div class="cc-tl-miss">保修时间线待生成：补充购买日期与保修期限后，这里会按起算日、今天与到期日画出时间线。</div>';
  }
  const fr = (k,v)=> '<div class="fr"><div class="fk">'+k+'</div><div class="fv">'+v+'</div></div>';
  const riskHtml = (c.risks && c.risks.length)
    ? '<div class="concl-risk"><div class="rk-t"><svg class="ic sm"><use href="#i-alert"/></svg>风险提示</div>'
      + c.risks.map(r=>'<div class="rk-i">'+esc(r)+'</div>').join('') + '</div>' : '';
  const chainHtml = (!compact && c.chain && c.chain.length)
    ? '<div class="concl-chain"><div class="at">证据链 · 这个结论是怎么来的</div><div class="timeline">'
      + c.chain.map(e=>'<div class="ev"><span class="d">'+esc(e.date||'—')+'</span> '+esc(e.label)+'</div>').join('') + '</div></div>' : '';
  const fixHtml = (c.fixReasons && c.fixReasons.length)
    ? '<div style="padding:12px 18px 0"><div class="warnbox" style="margin:0"><b>数据待修正（暂不出正式结论）：</b><br>'
      + c.fixReasons.map(r=>'· '+esc(r)).join('<br>')
      + '<div style="margin-top:8px"><button class="btn small primary" onclick="openProductForm(\''+p.id+'\')">修正档案</button></div></div></div>' : '';
  const big = c.daysWhole===null
    ? '<span class="n">—</span><span class="u">信息不全</span>'
    : c.daysWhole<0
      ? '<span class="n">'+Math.abs(c.daysWhole)+'</span><span class="u">天 · 整机已过保</span>'
      : '<span class="n">'+c.daysWhole+'</span><span class="u">天 · 整机剩余</span>';
  return '<div class="conclusion">'
    /* 深色结论封面 */
    + '<div class="concl-cover">'
    + '<div class="cc-eyebrow"><span class="cc-eb"><span>WARRANTY VERDICT</span><span class="cc-sep"> · </span><span>保修结论卡</span></span><span class="arch-no on-dark">'+archiveNo(p)+'</span></div>'
    + '<div class="cc-name">'+esc(p.name)+' · '+esc(p.brand)+(p.model?' '+esc(p.model):'')+(p.demo?' · 演示数据':'')+'</div>'
    + '<div class="cc-verdict">'+esc(c.status)+' · '+esc(c.tierLabel)+'</div>'
    + '<div class="cc-badges"><span class="pill st-'+c.status+'">'+c.status+'</span><span class="pill tier-'+c.tier+'">档位 '+c.tier+' · '+c.tierLabel+'</span></div>'
    + '<div class="cc-hero"><div class="cc-big">'+big+'</div>'
    + '<div class="cc-side">整机预计到期 <b>'+(c.endWhole||'—')+'</b><br>主要部件 '+(c.endParts ? '到期 <b>'+c.endParts+'</b>（'+(c.daysParts<0?'已过保 '+Math.abs(c.daysParts)+' 天':'剩余 '+c.daysParts+' 天')+'）' : '无单独保修')+'</div></div>'
    + '<div class="cc-tierdesc">'+esc(c.tierDesc)+'</div>'
    + tlHtml
    + '</div>'
    + fixHtml
    /* 01 证据档案 */
    + '<div class="concl-sec"><div class="sec-no">01</div><div class="sec-body"><div class="sec-t">证据档案</div>'
    + '<div class="concl-facts">'
    + fr('计算依据', esc(c.basis))
    + fr('证据来源', esc(c.evidence))
    + fr('证据强度', esc(c.strength))
    + fr('纠正记录', esc(c.corrections))
    + '</div>' + chainHtml + '</div></div>'
    /* 02 尚未核实与风险 */
    + '<div class="concl-sec"><div class="sec-no">02</div><div class="sec-body"><div class="sec-t">尚未核实与风险</div>'
    + (c.unverified!=='无' ? '<div class="concl-unv"><svg class="ic"><use href="#i-alert"/></svg><span><b>尚未核实：</b>'+esc(c.unverified)+'</span></div>' : '<div style="font-size:13.5px;color:var(--ink2)">尚未核实事项：无</div>')
    + riskHtml + '</div></div>'
    /* 03 下一步建议（行动分主次） */
    + '<div class="concl-sec"><div class="sec-no">03</div><div class="sec-body"><div class="sec-t">下一步建议</div>'
    + '<div class="concl-actions"><ol>'+c.actions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ol></div>'
    + '<div class="concl-btns">'
    + '<div class="cb-row"><button class="btn primary" onclick="openPolicy(\''+p.id+'\')"><svg class="ic"><use href="#i-search"/></svg>核验官方政策</button></div>'
    + '<div class="cb-row sub"><button class="btn cb-pkg" onclick="openPkg(\''+p.id+'\')"><svg class="ic"><use href="#i-doc"/></svg>报修资料包</button>'
    + '<button class="btn cb-sec" onclick="openProductForm(\''+p.id+'\')"><svg class="ic"><use href="#i-pen"/></svg>改档案</button>'
    + '<button class="btn cb-sec" onclick="openRepair(\''+p.id+'\')"><svg class="ic"><use href="#i-wrench"/></svg>记维修</button></div>'
    + '</div></div></div>'
    + '<div class="concl-foot"><span>生成于 '+c.generatedAt+'</span><span>规则版本 '+c.ruleVersion+'</span><span>档案编号 '+archiveNo(p)+'</span></div>'
    + '</div>';
}

function renderList(){
  const q = (document.getElementById('q').value||'').trim();
  const sf = document.getElementById('statusFilter').value;
  let items = store.products.map(p=>({p, w:warrantyOf(p)}));
  items.sort((a,b)=>{ const da=a.w.daysWhole, db=b.w.daysWhole; if(da===null) return 1; if(db===null) return -1; return da-db; });
  if(q) items = items.filter(({p})=> (p.name+p.brand+p.category+(p.model||'')).includes(q));
  if(sf) items = items.filter(({w})=> w.status===sf);
  const el = document.getElementById('prodList');
  if(!items.length){ el.innerHTML = '<div class="empty"><div class="eic"><svg class="ic"><use href="#i-folder"/></svg></div><div class="et">还没有保修档案</div><div class="es">点上方「拍凭证建档」或「手动录入」添加第一件家电；也可以先载入演示数据，看看结论卡长什么样。</div></div>'; return; }
  /* V2.1：档案页与概览档案墙共用同一套 tileHTML 档案卡组件（含类别图标、编号、
     商品名、剩余天数、带起算/到期标注的进度条、状态＋证据等级），不再另起一套 prod-card */
  el.innerHTML = items.map(({p,w})=> tileHTML(p, w)).join('');
  hydratePhotos(el);
}

  const repls = store.replacements.filter(e=>e.product_id===pid);

  const kv = (k,v)=> v? '<tr><td class="k">'+k+'</td><td>'+esc(v)+'</td></tr>' : '';
  let html = '<button class="btn ghost small" onclick="backToList()"><svg class="ic sm"><use href="#i-back"/></svg>返回列表</button>'

    + '<div class="card"><div class="prod-head">'+detailThumbHTML(p)+'<div class="ph-main"><span class="prod-name">'+esc(p.name)+'</span>'+(p.demo?'<span class="demo-tag">演示数据</span>':'')
    + '<div class="prod-sub">'+esc(p.brand)+' · '+esc(p.category)+'</div></div></div><table class="kv">'

    + kv('保修期来源', p.warranty_source) + kv('凭证', p.evidence_desc) + kv('建档方式', p.source)

    + '</table>'
    + '<div class="toolbar" style="margin-top:12px">'
    + '<button class="btn primary small" onclick="openPkg(\''+p.id+'\')"><svg class="ic sm"><use href="#i-box"/></svg>报修资料包</button>'
    + '<button class="btn small" onclick="openRepair(\''+p.id+'\')"><svg class="ic sm"><use href="#i-wrench"/></svg>记维修</button>'
    + '<button class="btn small" onclick="openPolicy(\''+p.id+'\')"><svg class="ic sm"><use href="#i-search"/></svg>核验保修政策</button>'
    + '<button class="btn small" onclick="openEvent(\''+p.id+'\',\'part\')"><svg class="ic sm"><use href="#i-puzzle"/></svg>部件事件</button>'
    + '<button class="btn small" onclick="openEvent(\''+p.id+'\',\'replace\')">换新事件</button>'
    + '<button class="btn small" onclick="openProductForm(\''+p.id+'\')"><svg class="ic sm"><use href="#i-pen"/></svg>编辑</button>'
    + '<button class="btn ghost small" onclick="delProduct(\''+p.id+'\')"><svg class="ic sm"><use href="#i-trash"/></svg>删除</button>'
    + (p.conflict ? '<button class="btn small" onclick="resolveConflict(\''+p.id+'\')"><svg class="ic sm"><use href="#i-check"/></svg>确认冲突已核对（以凭证为准）</button>' : '')
    + '</div></div>';
  if(checks.length){
    /* V2.3 第二批：核验记录结构化呈现——字段名/值成行，长原始内容收进「查看完整记录」展开区；
       字段值全部取自记录本身，缺失口径照实写（待补录/未声明），不改任何证据状态 */
    const fr2 = (k,v)=> '<div class="fr"><div class="fk">'+k+'</div><div class="fv">'+v+'</div></div>';
    html += '<div class="card"><div class="sec-title"><svg class="ic"><use href="#i-search"/></svg>政策核验记录</div>'
      + checks.map((c,i)=>{
        const trace = checkTraceLevel(c, p);
        const subVal = c.submitted_at ? esc(c.submitted_at)+'（用户提交）' : '历史记录，缺少用户提交时间，待补录';
        const confVal = c.user_confirmed ? '用户声明已查阅官方页面' : '未声明已查阅官方页面';
        const full = '核验方式：'+(c.source_desc||'—')+'；提交时间：'+(c.submitted_at ? c.submitted_at+'（用户提交）' : '历史记录，缺少用户提交时间，待补录')
          +'；查得期限：'+(c.warranty_months_found||'—')+'；留痕等级：'+trace+'；官方确认：'+confVal
          +(c.official_entry ? '；官方入口：'+c.official_entry : '')+(c.official_url ? '；官方链接：'+c.official_url : '')+(c.checked_at ? '；核验日期：'+c.checked_at : '');
        return '<div class="chk-block"><div class="concl-facts chk-facts">'
          + fr2('核验方式', esc(c.source_desc||'—'))
          + fr2('提交时间', subVal)
          + fr2('查得期限', esc(c.warranty_months_found||'—'))
          + fr2('留痕等级', esc(trace))
          + fr2('官方确认', confVal)
          + (c.official_entry ? fr2('官方入口', esc(c.official_entry)) : '')
          + (c.checked_at ? fr2('核验日期', esc(c.checked_at)) : '')
          + '</div>'
          + '<button class="btn ghost small" onclick="toggleFold(\'chkfull-'+p.id+'-'+i+'\',this)">查看完整记录</button>'
          + '<div id="chkfull-'+p.id+'-'+i+'" class="fold-body" style="display:none">'+esc(full)+'</div></div>';
      }).join('') + '</div>';
  }

  const er = p.evidence_record;
