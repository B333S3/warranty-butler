        + '<div class="toolbar" style="margin-top:10px"><button class="btn ghost small" onclick="removeEvidence(\''+p.id+'\')">清除失效记录</button></div>';
    } else if(er.kind==='upload'){
      const frE = (k,v)=> '<div class="fr"><div class="fk">'+k+'</div><div class="fv">'+v+'</div></div>';
      html += '<div class="concl-facts chk-facts">'
        + frE('凭证文件', esc(er.name||'凭证文件'))
        + frE('文件类型', esc(er.type||'未知类型'))
        + frE('文件大小', esc(er.size||0)+' 字节')
        + frE('存证时间', esc(er.at||''))
        + frE('SHA-256', '<span style="word-break:break-all">'+esc(er.sha256||'')+'</span>')
        + '</div>'
        + '<div class="toolbar" style="margin-top:10px"><button class="btn small" onclick="viewEvidence(\''+p.id+'\')"><svg class="ic sm"><use href="#i-doc"/></svg>查看凭证</button>'
        + '<button class="btn ghost small" onclick="removeEvidence(\''+p.id+'\')">移除凭证</button></div><div id="evPreview-'+p.id+'" style="margin-top:8px"></div>';
    } else if(er.kind==='vision'){
      const edited = (er.fields_edited||[]);
      const frE = (k,v)=> '<div class="fr"><div class="fk">'+k+'</div><div class="fv">'+v+'</div></div>';
      html += '<div class="concl-facts chk-facts">'
        + frE('记录类型', 'AI 视觉识别记录')

        + frE('识别时间', esc(er.at||''))
        + frE('原图 SHA-256', '<span style="word-break:break-all">'+esc(er.sha256||'')+'</span>')
        + frE('确认时修改字段', edited.length ? edited.map(k=>esc(labelOf(k))).join('、') : '无（识别结果原样确认）')
        + '</div>'
        + (er.raw_text ? '<div class="toolbar" style="margin-top:8px"><button class="btn small" onclick="toggleRawText(\''+p.id+'\')">查看识别原文</button></div><div id="rawText-'+p.id+'" style="display:none;font-size:13px;color:var(--ink2);white-space:pre-wrap;margin-top:6px">'+esc(er.raw_text)+'</div>' : '')
        + '<div class="toolbar" style="margin-top:10px"><button class="btn small" onclick="viewEvidence(\''+p.id+'\')"><svg class="ic sm"><use href="#i-doc"/></svg>查看识别原图</button>'
        + '<button class="btn ghost small" onclick="removeEvidence(\''+p.id+'\')">移除凭证</button></div><div id="evPreview-'+p.id+'" style="margin-top:8px"></div>';
    }
    html += '</div>';

  if(parts.length || repls.length){
    html += '<div class="card"><div class="sec-title"><svg class="ic"><use href="#i-puzzle"/></svg>事件记录</div><div class="timeline">'
      + parts.map(e=>'<div class="ev"><span class="d">'+esc(e.start_date)+'</span> 部件事件 · '+esc(e.part_name)+'（'+esc(e.event_type)+'）保修 '+esc(e.months)+' 个月'+(e.note?' · '+esc(e.note):'')+(validPartEvent(e, p)?'':' · <b style="color:var(--bad)">未参与计算（数据不合法）</b>')+'</div>').join('')
      + repls.map(e=>'<div class="ev"><span class="d">'+esc(e.event_date)+'</span> 换新事件 · 旧 '+esc(e.old_serial_no||'—')+' → 新 '+esc(e.new_serial_no||'—')+' · 保修口径：'+esc(e.warranty_reset)+(e.warranty_reset!=='不重算'?'（已参与重算）':'（仅留痕）')+(e.note?' · '+esc(e.note):'')+'</div>').join('')
      + '</div></div>';
  }
  html += '<div class="card"><div class="sec-title"><svg class="ic"><use href="#i-wrench"/></svg>维修历史</div>';
  if(reps.length){
    html += '<div class="timeline">'+reps.map(r=>'<div class="ev"><span class="d">'+esc(r.repair_date)+'</span> '+esc(r.fault_desc)+' · '+esc(r.provider_type)+' · '+(r.in_warranty?'保内免费':'费用 ¥'+r.cost)+' · 结果：'+esc(r.result)+(r.note?'<br>'+esc(r.note):'')+'</div>').join('')+'</div>';
    const total = store.repairs.filter(r=>r.product_id===pid).reduce((s,r)=>s+Number(r.cost||0),0);

    html += '<div style="font-size:13.5px;color:var(--ink2);margin-top:8px">本机累计维修花费 ¥'+total+' · 保内免费处理 '+freeN+' 次</div>';
  } else html += '<div class="empty">暂无维修记录</div>';
  html += '</div>';
  const wrap = document.getElementById('archiveDetailWrap');
  wrap.innerHTML = html; wrap.style.display='';

function delProduct(pid){
  const dp = byId(pid);
  if(!confirm('确认删除这件商品的档案？相关维修、核验与事件记录会一并删除。')) return;
  const fid = dp && dp.evidence_record && dp.evidence_record.file_id;
  const phid = dp && dp.photo_file_id;
  store.products = store.products.filter(p=>p.id!==pid);
  ['repairs','policyChecks','replacements','partEvents','reminders'].forEach(k=>{ store[k]=store[k].filter(x=>x.product_id!==pid); });
  save(); backToList(); updateBadge(); toast('档案已删除');
  /* v1.5：删档案同步删存证 Blob，不留孤儿文件；V2.1：删前查引用，共享文件不误删 */
  if(fileSafeToDelete(fid, pid)) idbDeleteFile(fid).catch(()=>{});
  /* V2.2：商品照片 Blob 同步清理（同样先查引用） */
  if(phid && phid!==fid && fileSafeToDelete(phid, pid)) idbDeleteFile(phid).catch(()=>{});
}
/* 查看凭证：从 IndexedDB 读回 Blob——图片内嵌预览，其他类型新窗口打开；
   读不到（已被清理）→ 当场标记失效并按无凭证重渲染（与启动校验同一口径）。 */
async function viewEvidence(pid){
  const p = byId(pid); if(!p || !p.evidence_record || !p.evidence_record.file_id) return;
  const box = document.getElementById('evPreview-'+pid);
  try{
    const blob = await idbGetFile(p.evidence_record.file_id);
    if(!blob){
      p.evidence_record.invalid = true; save(); openDetail(pid); renderAll();
      alert('凭证原图已不存在（本机存证可能被浏览器清理），这条证据记录已标记失效，结论按无凭证处理。');
      return;
    }
    const url = URL.createObjectURL(blob);
    if((blob.type||'').indexOf('image/')===0){ if(box) box.innerHTML = '<img src="'+url+'" alt="凭证原图" style="max-width:100%;border-radius:var(--r-md)">'; }
    else window.open(url, '_blank');
  }catch(e){ alert('读取凭证失败：'+(e.message||'未知错误')); }
}
/* 移除凭证：删 IndexedDB 里的 Blob 并摘掉证据记录，结论档位随之回落（诚实降档）。 */
async function removeEvidence(pid){
  const p = byId(pid); if(!p || !p.evidence_record) return;
  if(!confirm('移除这件商品的凭证证据？存证原图将从本机删除，结论档位会随之下降。')) return;
  const fid = p.evidence_record.file_id;
  if(fileSafeToDelete(fid, pid)){ try{ await idbDeleteFile(fid); }catch(e){} }
  delete p.evidence_record;
  save(); renderAll(); openDetail(pid); toast('凭证已移除，结论已按无凭证重算');
}
function toggleRawText(pid){ const el = document.getElementById('rawText-'+pid); if(el) el.style.display = (el.style.display==='none') ? '' : 'none'; }
/* V2.3 第二批：证据结构化展开区开关（查看完整记录 ⇄ 收起完整记录） */
function toggleFold(id, btn){ const el = document.getElementById(id); if(!el) return; const open = el.style.display==='none'; el.style.display = open ? '' : 'none'; if(btn) btn.textContent = open ? '收起完整记录' : '查看完整记录'; }
function resolveConflict(pid){
  const p = byId(pid); if(!p) return;
  (p.correction_log = p.correction_log||[]).push({field:'冲突确认', old_value:p.conflict_desc||'存在冲突', new_value:'用户已人工确认，以凭证记载为准', at:todayStr()});
  p.conflict = false; p.conflict_desc = '';
  save(); openDetail(pid);
}

/* ================= 弹窗通用 ================= */
/* V2.1 任务书：弹窗打开锁背景滚动，关闭后恢复（滚动位置由浏览器保持） */
function openModal(id){ document.getElementById(id).classList.add('open'); try{ document.body.style.overflow='hidden'; }catch(e){} }
function closeModal(id){ document.getElementById(id).classList.remove('open'); try{ if(!document.querySelector('.modal-mask.open')) document.body.style.overflow=''; }catch(e){} }
document.querySelectorAll('.modal-mask').forEach(m=> m.addEventListener('click', e=>{ if(e.target===m) closeModal(m.id); }));
/* V2.1 任务书：轻量 Toast——保存成功/失败的明确反馈（失败原因仍走 alert/warnbox，Toast 只报结果） */
function toast(msg){
  try{
    /* V2.3 查杀①（真点 W4 实证）：落盘失败后，各保存流自己的「已建档/已保存」成功提示会盖掉失败提示、
       等于假装保存成功。这里统一设闸：最近一次落盘失败期间，任何报喜文案一律换成失败提示，
       直到下一次落盘真正成功为止。演示模式下 save() 恒返回成功，不受影响。 */
    if(!lastSaveOk && !String(msg).includes('保存失败')) msg = '保存失败：本机存储空间不足或被浏览器禁用，数据暂存在当前页面中，请勿关闭页面，并尽快清理浏览器存储空间';
    let el = document.getElementById('appToast');
    if(!el){ el = document.createElement('div'); el.id='appToast'; el.className='app-toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(()=> el.classList.remove('show'), 2200);
  }catch(e){}
}

/* ================= 商品表单（手动录入 / 编辑） ================= */
let editingId = null;
const PF_FIELDS = [
  ['name','商品名 *','text'],['brand','品牌 *','text'],['model','型号','text'],['serial_no','序列号','text'],
  ['category','品类','select:大家电|小家电|厨电|手机数码|电脑|家具|其他'],
  ['purchase_date','购买日期','date'],['invoice_date','发票日期（起算依据选发票日时用）','date'],['activation_date','激活日期（起算依据选激活日时用）','date'],['start_basis','起算依据','select:购买日|发票日|激活日'],
  ['price','购买价格（元）','number'],['channel','购买渠道','text'],['seller','商家/店铺','text'],['invoice_no','发票号','text'],
  ['warranty_months_whole','整机保修月数 *','number'],['warranty_months_parts','主要部件保修月数','number'],['extended_months','延保月数（无填 0）','number'],
  ['warranty_source','保修期来源','select:凭证|品牌政策|用户填写|品类估算'],
  ['evidence_desc','凭证说明（如：订单截图 2025-05-18）','text']
];
function fieldHTML(f, val, conf){
  const [key,label,type] = f;
  const lo = conf!==undefined && conf<0.8;
  let input;
  if(type.startsWith('select:')){
    const opts = type.slice(7).split('|');
    input = '<select id="pf-'+key+'">'+opts.map(o=>'<option '+(o===val?'selected':'')+'>'+o+'</option>').join('')+'</select>';
  } else input = '<input id="pf-'+key+'" type="'+type+'" value="'+esc(val==null?'':val)+'">';
  return '<div class="frow'+(lo?' lowconf':'')+'"><label>'+label+(conf!==undefined?'<span class="conf '+(lo?'lo':'hi')+'">识别置信度 '+Math.round(conf*100)+'%'+(lo?'，请重点核对':'')+'</span>':'')+'</label>'+input+'</div>';
}
let pendingEvidence = null;
let pendingPhoto = null; /* V2.2 商品照片：选图即存入本机 IndexedDB，保存档案时才挂 photo_file_id 引用 */
let photoBusy = false;   /* V2.2：照片存入中禁止保存档案（与 evidenceBusy 同口径，防竞态） */
/* V2.1 任务书·坑 1/4：存证进行中禁止保存档案（防上传竞态造假凭证）；提交锁防重复建档 */
let evidenceBusy = false;
let lockProduct = false, lockRecog = false, lockPolicy = false; /* 按表单分锁，互不干扰 */
/* v1.5 真持久化：选文件即读内容→算 SHA-256→写入 IndexedDB，全部成功才生成 upload 记录；
   写入失败 → 明确提示用户、pendingEvidence 保持 null，保存档案时不带证据、不升档。 */
async function onEvidenceFile(input){
  const f = input.files && input.files[0];
  pendingEvidence = null;
  const note = document.getElementById('pf-evnote');
  if(!f){ if(note) note.textContent = '尚未选择凭证文件。'; return; }
  if(note) note.textContent = '正在把凭证文件存入本机存证库…';
  evidenceBusy = true; /* 存证事务＋哈希全部确认前，saveProductForm 会拦下保存 */
  try{
    const saved = await persistEvidenceFile(f);
    pendingEvidence = buildUploadRecord({file_id:saved.file_id, sha256:saved.sha256, name:f.name, type:f.type||'', size:f.size, at:nowStr()});
    if(!pendingEvidence) throw new Error('证据记录生成失败');
    if(note) note.textContent = '凭证已存证：'+f.name+'（SHA-256 '+saved.sha256.slice(0,12)+'…），保存档案后作为升档证据，可在详情页查看原图。';
  }catch(e){
    pendingEvidence = null;
    if(note) note.textContent = '凭证保存失败（'+(e.message||'未知错误')+'）：未生成证据记录，本次保存不会带凭证升档。';
    alert('凭证文件保存失败：'+(e.message||'未知错误')+'\n本次不会生成证据记录，档案结论不会因此升档。可以重试上传，或先不传凭证保存档案。');
  }finally{
    evidenceBusy = false;
  }
}
/* V2.2 商品照片上传：复用存证层 persistEvidenceFile 真存入 IndexedDB，成功才挂 pendingPhoto；
   失败明确提示、本次保存不带照片（照片不影响证据档位，只影响卡片展示）。 */
async function onPhotoFile(input){
  const f = input.files && input.files[0];
  pendingPhoto = null;
  const note = document.getElementById('pf-photonote');
  if(!f){ if(note) note.textContent = '尚未选择商品照片。'; return; }
  if(note) note.textContent = '正在把商品照片存入本机…';
  photoBusy = true;
  try{
    const saved = await persistEvidenceFile(f);
    pendingPhoto = { file_id: saved.file_id };
    if(note) note.textContent = '商品照片已存入本机：'+f.name+'，保存档案后显示在卡片与详情页。';
  }catch(e){
    pendingPhoto = null;
    if(note) note.textContent = '商品照片保存失败（'+(e.message||'未知错误')+'）：本次保存不会带照片，档案其他内容不受影响。';
  }finally{
    photoBusy = false;
  }
}
function openProductForm(pid, draft){
  editingId = pid || null;
  pendingEvidence = null;
  pendingPhoto = null;
  photoBusy = false;
  lockProduct = false;
  const p = pid ? byId(pid) : (draft || {start_basis:'购买日', extended_months:0, warranty_source:'用户填写', category:'大家电'});

  document.getElementById('pfBody').innerHTML = '<div class="grid2">'+PF_FIELDS.map(f=>fieldHTML(f, p[f[0]])).join('')+'</div>'
    + '<div class="frow"><label>上传凭证文件（可选）</label><input type="file" id="pf-evfile" accept="image/*,.pdf" onchange="onEvidenceFile(this)">'
    + '<div class="hint" id="pf-evnote">'+(p.evidence_record ? '当前已有证据记录：'+(p.evidence_record.kind==='vision' ? '视觉识别记录' : '凭证文件 '+(p.evidence_record.name||''))+'（重新上传将替换）' : '真实上传的凭证文件才算升档证据；只填「凭证说明」文字不算证据。')+'</div></div>'
    + '<div class="frow"><label>商品照片（可选）</label><input type="file" id="pf-photofile" accept="image/*" onchange="onPhotoFile(this)">'
    + '<div class="hint" id="pf-photonote">'+(p.photo_file_id && !p.photo_invalid ? '当前已有商品照片（重新上传将替换，不上传则保留）。照片只存本机、显示在档案卡片上，不作保修证据。' : '上传一张商品照片，显示在档案卡片与详情页；只存本机，不上传服务器，也不作保修证据。')+'</div></div>'
    + '<div class="hint">带 * 为关键字段：缺购买日期或整机保修月数时，结论只能是「暂不能判断」。保修期若只是按品类估算，请把来源选为「品类估算」，结论将只作参考。日期必须是真实日期，保修月数必须为正整数、延保为非负整数，填错会进入「待修正」状态。</div>';
  openModal('productModal');
}
function saveProductForm(){
  if(lockProduct) return; /* V2.1：连点/重复提交只生效一次 */
  if(evidenceBusy){ alert('凭证文件正在存入本机存证库，请等「凭证已存证」提示出现后再保存档案'); return; }
  if(photoBusy){ alert('商品照片正在存入本机，请等照片保存完成的提示出现后再保存档案'); return; }
  const g = k=>{ const el=document.getElementById('pf-'+k); return el? el.value.trim() : ''; };
  const num = k=>{ const v=g(k); return v===''?'':Number(v); };
  const data = { name:g('name'), brand:g('brand'), model:g('model'), serial_no:g('serial_no'), category:g('category'),
    purchase_date:g('purchase_date'), invoice_date:g('invoice_date'), activation_date:g('activation_date'), start_basis:g('start_basis'), price:num('price'), channel:g('channel'), seller:g('seller'),
    invoice_no:g('invoice_no'), warranty_months_whole:num('warranty_months_whole'), warranty_months_parts:num('warranty_months_parts'),
    extended_months:num('extended_months')||0, warranty_source:g('warranty_source'), evidence_desc:g('evidence_desc') };
  if(!data.name || !data.brand){ alert('商品名和品牌必填'); return; }
  /* 严格校验（v1.3）：假日期/小数月数在入口就拦下，不许存进档案再污染结论 */
  for(const [k,label] of [['purchase_date','购买日期'],['invoice_date','发票日期'],['activation_date','激活日期']]){
    if(data[k] && !isValidDateStr(data[k])){ alert(label+'「'+data[k]+'」不是真实日期（须为真实存在的 YYYY-MM-DD 日期）'); return; }
  }
  if(data.warranty_months_whole!=='' && !isPosIntMonths(data.warranty_months_whole)){ alert('整机保修月数必须为正整数（如 36），不能填小数'); return; }
  if(data.warranty_months_parts!=='' && !isPosIntMonths(data.warranty_months_parts)){ alert('主要部件保修月数必须为正整数'); return; }
  if(g('extended_months')!=='' && !isNonNegIntMonths(g('extended_months'))){ alert('延保月数必须为非负整数（无延保填 0）'); return; }
  /* 输入校验（评委动线猎杀 P1-2＋终检猎杀扩围）：三个日期都须落在合理区间——起算依据
     可选发票日/激活日，只拦购买日期时，发票日填 2999 同样算出天文数字结论；
     留空仍按原设计走「暂不能判断」，不拦 */
  for(const [k,label] of [['purchase_date','购买日期'],['invoice_date','发票日期'],['activation_date','激活日期']]){
    if(dateOutOfRange(data[k])){ alert(label+'「'+data[k]+'」超出合理范围：不能晚于今天，也不能早于 1970-01-01，请核对年份是否填错'); return; }
  }
  /* 输入校验（评委动线猎杀 P1-1）：价格此前零校验，负数/天价会静默入库并原样上屏（如 ¥-500） */
  if(data.price!==''){
    const pv = Number(data.price);
    if(!Number.isFinite(pv) || pv<0 || pv>10000000 || Math.abs(pv*100-Math.round(pv*100))>1e-9){ alert('购买价格须为 0–10,000,000 元之间的数字（最多两位小数），请修正后再保存'); return; }
  }
  lockProduct = true; /* 校验全过、进入落库：此后重复点击一律忽略 */
  if(pendingEvidence) data.evidence_record = pendingEvidence;
  if(pendingPhoto) data.photo_file_id = pendingPhoto.file_id;
  if(editingId){
    const p = byId(editingId);
    const oldFileId = p.evidence_record && p.evidence_record.file_id;
    const oldPhotoId = p.photo_file_id;
    ['purchase_date','invoice_date','activation_date','warranty_months_whole','warranty_months_parts','extended_months','start_basis'].forEach(k=>{
      if(String(p[k]??'') !== String(data[k]??'')) (p.correction_log=p.correction_log||[]).push({field:k, old_value:String(p[k]??'（空）'), new_value:String(data[k]??'（空）'), at:todayStr()});
    });
    Object.assign(p, data);
    /* v1.5：凭证被新上传替换时，旧存证 Blob 同步删除，不留孤儿文件；V2.1：删前查引用 */
    if(pendingEvidence && oldFileId && oldFileId !== pendingEvidence.file_id && fileSafeToDelete(oldFileId, editingId)) idbDeleteFile(oldFileId).catch(()=>{});
    /* V2.2：商品照片被替换时，旧照片 Blob 同步删除（删前查引用），并清除失效标记 */
    if(pendingPhoto){ p.photo_invalid = false;
      if(oldPhotoId && oldPhotoId !== pendingPhoto.file_id && fileSafeToDelete(oldPhotoId, editingId)) idbDeleteFile(oldPhotoId).catch(()=>{}); }
  } else {
    /* 评委动线猎杀 P1-3：演示模式下新建的档案与演示数据集同一标记（demo），
       卡片/详情/结论卡自动带「演示数据」标签，退出演示随演示集一并清除 */
    store.products.push(Object.assign({id:uid(), source:'手动表单', conflict:false, conflict_desc:'', correction_log:[], demo:demoMode, created_at:todayStr()}, data));
  }
  save(); closeModal('productModal'); syncReminders(); renderAll();
  toast(editingId ? '档案已更新' : (demoMode ? '已建档（演示数据，退出演示将一并清除）' : '已建档'));
  if(document.getElementById('view-archive').classList.contains('active') && editingId) openDetail(editingId);
  editingId = null;
}

let recogSeq = 0; /* V2.3 查杀④：识别会话令牌——开新会话/重选/换模拟流程都会递增，迟到的异步回调凭它作废 */

async function recogUploadAI(input){
  const f = input.files && input.files[0]; if(!f) return;
  const mySeq = ++recogSeq; /* 本轮令牌：其后任何新会话（重开/重选/模拟）递增 recogSeq 即令本轮作废 */
  const box = document.getElementById('recogPreview');
  box.innerHTML = '<div class="hint">正在读取图片…</div>';
  try{
    const dataUrl = await downscaleImage(f);
    if(mySeq !== recogSeq) return; /* 已被新会话取代：不写状态、不碰界面；已落库的原图交启动孤儿清理回收 */
    recogCtx = { mode:'ai-pending', imageData: dataUrl, fileName: f.name||'' };
    /* v1.5（P0-04）：识别前先把原图存证（IndexedDB＋SHA-256），建档时 vision 记录引用它；
       存证失败不中断识别，但建档不会生成 vision 证据记录、结论不升档（界面明示）。 */
    try{
      const saved = await persistEvidenceFile(f);
      if(mySeq !== recogSeq) return; /* 同上：迟到的存证结果不许挂到新会话的 recogCtx 上 */
      recogCtx.fileId = saved.file_id; recogCtx.fileSha256 = saved.sha256;
    }catch(e){ if(mySeq !== recogSeq) return; recogCtx.persistError = (e && e.message) || '存证失败'; }
    box.innerHTML = '<img src="'+dataUrl+'" alt="凭证预览" style="max-width:100%;border-radius:var(--r-md);margin-top:4px">'
      + '<div class="toolbar" style="margin-top:10px"><button class="btn primary" id="aiGoBtn" onclick="runAIExtract()">开始 AI 识别</button></div>'
      + '<div id="aiExtractState" style="font-size:13px;color:var(--ink2)"></div>'
      + (recogCtx.persistError
        ? '<div class="warnbox">原图存证失败（'+esc(recogCtx.persistError)+'）：本次识别仍可继续，但建档不会生成视觉证据记录、结论不升档。</div>'
        : '<div class="hint">原图已存入本机存证库（SHA-256 '+esc((recogCtx.fileSha256||'').slice(0,12))+'…），识别记录可追溯、可复查。</div>');
  }catch(e){
    if(mySeq !== recogSeq) return;
    box.innerHTML = '<div class="warnbox">图片读取失败，请换一张再试，或用下方模拟识别/手动录入。</div>';
  }
}
async function runAIExtract(){
  const mySeq = recogSeq; /* V2.3 查杀④：识别途中切页/关弹窗/重选凭证后，本轮结果回来也不许覆盖新界面 */
  const st = document.getElementById('aiExtractState');
  const btn = document.getElementById('aiGoBtn');
  if(btn) btn.disabled = true;
  if(st) st.textContent = 'AI 识别中（真实调用豆包视觉模型）…';
  try{
    const r = await aiExtract(recogCtx.imageData);
    if(mySeq !== recogSeq) return;
    const fields = {}, conf = {};
    Object.keys(r.fields||{}).forEach(k=>{ const cell = r.fields[k]||{}; fields[k] = (cell.value===null||cell.value===undefined)? '' : cell.value; conf[k] = typeof cell.confidence==='number'? cell.confidence : undefined; });
    if(!fields.category) fields.category = '其他';
    if(!fields.start_basis) fields.start_basis = '购买日';
    if(fields.extended_months==='' || fields.extended_months===undefined) fields.extended_months = 0;
    fields.warranty_source = '凭证';
    /* v1.5（P0-04）：追溯材料随识别结果一并留存——实际调用的模型标识（设置里的接入点 ID）、
       精确识别时间、呈现给用户的识别原值 fieldsRaw；确认建档时再补终值与被改字段清单。 */
    recogCtx = { mode:'ai', evidence:'票据照片（豆包视觉 AI 识别，'+todayStr()+'）', rawText: r.raw_text||'', fileName: recogCtx.fileName||'',
      fileId: recogCtx.fileId||'', fileSha256: recogCtx.fileSha256||'', persistError: recogCtx.persistError||'',
      model: (aiSettings().endpoint || PROXY_MODEL), visionAt: nowStr(), fieldsRaw: Object.assign({}, fields) };
    renderRecogForm(fields, conf, '真实 AI 识别完成：字段来自豆包视觉模型提取。低置信度字段已标红，请逐项核对修正；<strong>确认后才建档</strong>。');
  }catch(e){
    if(mySeq !== recogSeq) return;
    if(st) st.innerHTML = 'AI 识别失败（'+esc(e.message||'网络错误')+'）。已自动回落：可使用下方<b>模拟识别</b>或到档案页手动录入。';
    if(btn) btn.disabled = false;
  }
}
function renderRecogForm(f, conf, note){
  const order = ['name','brand','model','serial_no','category','purchase_date','invoice_date','start_basis','price','channel','seller','invoice_no','warranty_months_whole','warranty_months_parts','extended_months','warranty_source'];
  const labelOf = k=> (PF_FIELDS.find(x=>x[0]===k)||[k,k])[1];
  const typeOf = k=> (PF_FIELDS.find(x=>x[0]===k)||[k,k,'text'])[2];
  let html = '<div class="hint">'+note+'</div><div class="grid2">';
  order.forEach(k=>{
    const fld = [k, labelOf(k), typeOf(k)];
    html += fieldHTML(fld, f[k], conf[k]).replace('id="pf-','id="rf-');
  });
  html += '</div>';
  if(f.invoice_date && f.purchase_date){
    const dd = Math.round((parseDate(f.invoice_date)-parseDate(f.purchase_date))/86400000);
    if(dd>90) html += '<div class="warnbox">日期冲突提示：发票日期（'+f.invoice_date+'）比购买日期（'+f.purchase_date+'）晚 90 天以上。建档时将以你确认的「起算依据」为准，请核对购买日期是否识别有误。</div>';
  }
  html += '<div class="actions"><button class="btn ghost" onclick="openRecog()">重选凭证</button>'
    + '<button class="btn" onclick="closeModal(\'recogModal\')">放弃</button>'
    + '<button class="btn primary" onclick="confirmRecog()">确认无误，建档</button></div>';
  document.getElementById('recogBody').innerHTML = html;
}
function startRecog(kind){
  recogSeq++; /* 模拟识别也是新会话：令在飞的真实识别回调作废 */
  const preset = RECOG_PRESETS[kind];
  recogCtx = { mode:'mock', preset, evidence: preset.evidence+'（模拟识别，'+todayStr()+'）' };
  renderRecogForm(preset.fields, preset.conf, '识别完成（模拟）：共 16 个字段。低置信度字段已标红，请逐项核对修正；<strong>确认后才建档</strong>。');
}
function confirmRecog(){
  const g = k=>{ const el=document.getElementById('rf-'+k); return el? el.value.trim() : ''; };
  const num = k=>{ const v=g(k); return v===''?'':Number(v); };
  const data = { name:g('name'), brand:g('brand'), model:g('model'), serial_no:g('serial_no'), category:g('category'),
    purchase_date:g('purchase_date'), invoice_date:g('invoice_date'), activation_date:'', start_basis:g('start_basis'), price:num('price'), channel:g('channel'), seller:g('seller'),
    invoice_no:g('invoice_no'), warranty_months_whole:num('warranty_months_whole'), warranty_months_parts:num('warranty_months_parts'),
    extended_months:num('extended_months')||0, warranty_source:'凭证' };
  if(!data.name || data.name.includes('请补')){ alert('商品名未识别完整，请先补全商品名再建档'); return; }
  for(const [k,label] of [['purchase_date','购买日期'],['invoice_date','发票日期']]){
    if(data[k] && !isValidDateStr(data[k])){ alert(label+'「'+data[k]+'」不是真实日期，请核对修正后再建档'); return; }
  }
  if(data.warranty_months_whole!=='' && !isPosIntMonths(data.warranty_months_whole)){ alert('整机保修月数必须为正整数，请核对识别结果'); return; }
  if(data.warranty_months_parts!=='' && !isPosIntMonths(data.warranty_months_parts)){ alert('主要部件保修月数必须为正整数，请核对识别结果'); return; }
  /* 终检猎杀：识别路径此前只验日期格式与月数——价格与日期区间与手动表单同口径补齐。
     识别误读年份（如 2999）或用户在确认单里改出负价，都会静默入库再算出天文数字/¥-500 */
  for(const [k,label] of [['purchase_date','购买日期'],['invoice_date','发票日期']]){
    if(dateOutOfRange(data[k])){ alert(label+'「'+data[k]+'」超出合理范围：不能晚于今天，也不能早于 1970-01-01，请核对年份是否填错'); return; }
  }
  if(data.price!==''){
    const pv = Number(data.price);
    if(!Number.isFinite(pv) || pv<0 || pv>10000000 || Math.abs(pv*100-Math.round(pv*100))>1e-9){ alert('购买价格须为 0–10,000,000 元之间的数字（最多两位小数），请修正后再保存'); return; }
  }
  if(g('extended_months')!=='' && !isNonNegIntMonths(g('extended_months'))){ alert('延保月数必须为非负整数，请核对识别结果'); return; }
  const dup = store.products.find(p=>p.name===data.name && p.brand===data.brand && p.purchase_date===data.purchase_date);
  if(dup && !confirm('发现疑似重复档案（同名同品牌同购买日期），仍要另存一份吗？')) return;
  if(recogCtx && recogCtx._submitted) return; /* V2.1：同一张识别确认单只许提交一次，新会话（新 recogCtx）天然放行 */
  if(recogCtx) recogCtx._submitted = true;
  const p = Object.assign({id:uid(), source:'凭证识别', evidence_desc:recogCtx.evidence, conflict:false, conflict_desc:'', correction_log:[], demo:demoMode, created_at:todayStr()}, data);
  /* 真实 AI 识别建档 → 落完整 vision 追溯记录作为升档证据（v1.5）：原图引用＋哈希＋模型＋
     精确时间＋识别原文＋原值/终值/被改字段；原图未存证成功时 buildVisionRecord 返回 null、不落记录。
     模拟识别只留流程记录（界面全程标注模拟），不生成任何证据记录。 */
  if(recogCtx && recogCtx.mode==='ai'){
    p.evidence_record = buildVisionRecord({ file_id: recogCtx.fileId, sha256: recogCtx.fileSha256,
      at: recogCtx.visionAt || nowStr(), model: recogCtx.model||'', raw_text: recogCtx.rawText||'',
      fields_raw: recogCtx.fieldsRaw||{}, fields_final: Object.assign({}, data),
      fields_edited: diffEditedFields(recogCtx.fieldsRaw||{}, data) });
  }
  store.products.push(p); save(); closeModal('recogModal'); syncReminders(); renderAll();
  botSay('已建档：'+p.name+'。当前结论是「'+conclOf(p).tierLabel+'」档——'+(p.evidence_record ? '依据是凭证，还没和官方政策核对过。' : '依据是你确认录入的信息（本次未生成凭证记录），还没和官方政策核对过。')+'\n想把结论升到「已核实」，可以在档案详情里点「核验保修政策」，照着官方入口查到期限回填即可。'+(demoMode ? '\n（演示数据，退出演示将一并清除）' : ''));
  switchView('chat');
}

function savePolicy(forceConflict, asBackfill){
  const p = byId(policyPid); if(!p) return;
  const whole = document.getElementById('pc-whole').value.trim();
  const parts = document.getElementById('pc-parts').value.trim();
  const src = document.getElementById('pc-source').value.trim();
  const pastedUrl = (document.getElementById('pc-url') ? document.getElementById('pc-url').value.trim() : '');
  if(whole==='' || !src){ alert('请回填官方整机保修月数，并写明政策来源'); return; }
  if(!isPosIntMonths(whole) || (parts!=='' && !isPosIntMonths(parts))){ alert('保修月数必须为正整数（如 36），不能填小数'); return; }
  const mismatch = Number(whole) !== Number(p.warranty_months_whole);
  if(mismatch && !forceConflict){
    document.getElementById('pcConflict').innerHTML = '<div class="warnbox">⚠️ 官方期限（'+whole+' 个月）与档案现值（'+p.warranty_months_whole+' 个月）不一致。请选择：'
      + '<div style="margin-top:8px"><button class="btn small primary" onclick="savePolicyApply()">以官方政策为准（更新档案）</button> '
      + '<button class="btn small" onclick="savePolicy(true)">保留双方说法，标记「存在冲突」</button></div></div>';
    return;
  }
  /* 域名去伪拦截：粘贴了链接但域名不是该品牌官方域名 → 不许冒充官方留痕 */
  const domainOk = pastedUrl ? isOfficialUrl(pastedUrl, p.brand) : false;
  if(pastedUrl && !domainOk && !asBackfill){
    const domains = (OFFICIAL_DOMAINS[p.brand]||[]).join('、') || '（该品牌暂无官方域名清单）';
    document.getElementById('pcConflict').innerHTML = '<div class="warnbox">⚠️ 你粘贴的链接域名与'+esc(p.brand)+'官方域名（'+esc(domains)+'）对不上，不能记为官方留痕。请重新粘贴官方页面链接，或选择仅按「用户回填」保存（档位最高到凭证推算）。'
      + '<div style="margin-top:8px"><button class="btn small" onclick="savePolicy(false, true)">仍保存为用户回填</button></div></div>';
    return;
  }
  const confirmEl = document.getElementById('pc-confirm');
  const userConfirmed = !!(confirmEl && confirmEl.checked);
  if(lockPolicy) return; /* V2.1：核验保存防重复提交（冲突分支在锁之前，不受影响） */
  lockPolicy = true;
  store.policyChecks.push({id:uid(), product_id:p.id, brand:document.getElementById('pc-brand').value.trim() || p.brand, model:document.getElementById('pc-model').value.trim() || p.model || '',
    official_entry: officialEntry(p.brand), official_url: domainOk ? pastedUrl : '', declared_url: pastedUrl, user_confirmed: userConfirmed,
    warranty_months_found:'整机 '+whole+' 个月'+(parts!==''?' / 主要部件 '+parts+' 个月':''), source_desc:src, submitted_at:nowStr()});
  if(forceConflict){
    p.conflict = true; p.conflict_desc = '官方政策 '+whole+' 个月 与档案记载 '+p.warranty_months_whole+' 个月不一致，待人工确认';
  } else {
    p.warranty_source = '品牌政策';
    if(parts!=='' ) p.warranty_months_parts = Number(parts);
  }
  save(); closeModal('policyModal'); syncReminders(); renderAll(); openDetail(p.id);
  toast('核验结果已保存');
}
function savePolicyApply(){
  const p = byId(policyPid); if(!p) return;

<script>
/* ================= 对话（配置 AI 后走豆包大模型＋事实包；否则规则兜底问答） ================= */
/* ---------- 快捷问「看状态出牌」：候选池按当前状态生成，每次按优先级＋随机抽 3 条 ----------
   状态信号全部取自现有数据源（档案/到期/待处理/今日新建/最近结论卡/演示模式），
   chip 的视觉与点击行为与旧版一致（建档/档案/提醒走动作，其余填入并发送）。 */
function chipPool(){
  const pool = [];
  const add = (label, icon, act)=>{ if(label && !pool.some(c=>c.label===label)) pool.push({label, icon:icon||'#i-chat', act:act||'send'}); };
  const prods = store.products || [];
  if(demoMode){ /* 演示模式：引导体验核心功能 */
    add('冰箱还保修吗','#i-shield');
    add('冰箱压缩机坏了还保吗','#i-wrench');
    add('哪件快过保了','#i-clock');
    add('过保了怎么办','#i-alert');
    add('我的档案','#i-folder','archive');
    add('退出演示模式','#i-back','exitDemo');
    return pool;
  }
  if(!prods.length){ /* 档案为空：引导录入 / 试用演示 */
    add('拍凭证建档','#i-camera','recog');
    add('先看看演示数据','#i-play','demo');
    add('手动录入一件','#i-pen','manual');
    return pool;
  }
  const withW = prods.map(p=>({p, w:warrantyOf(p)}));
  /* 刚出结论卡：给跟进动作（对象＝对话上下文里的那件商品） */
  const lastCard = [...store.chat].reverse().find(m=>m.role==='bot' && m.html && m.html.includes('conclusion'));
  const ctxP = chatCtxPid ? byId(chatCtxPid) : null;
  if(lastCard && ctxP){
    add('帮我写售后话术','#i-pen');
    add(ctxP.name+'的主要部件保吗','#i-wrench');
    add('报修要带什么','#i-doc');
  }
  /* 有待处理事项 */
  if((store.reminders||[]).some(r=>r.state==='待决策')) add('看看待处理事项','#i-bell','reminders');
  /* 有已过保物品（过保最久的排先） */
  const over = withW.filter(r=>r.w.daysWhole!==null && r.w.daysWhole<0).sort((a,b)=>a.w.daysWhole-b.w.daysWhole);
  if(over.length) add(over[0].p.name+'过保了怎么办','#i-alert');
  /* 有物品 30 天内到期（最近到期的排先） */
  const near = withW.filter(r=>r.w.daysWhole!==null && r.w.daysWhole>=0 && r.w.daysWhole<=30).sort((a,b)=>a.w.daysWhole-b.w.daysWhole);
  if(near.length) add(near[0].p.name+'还保修吗','#i-clock');
  /* 今天刚录入的物品 */
  const fresh = prods.filter(p=>p.created_at===todayStr());
  if(fresh.length) add(fresh[fresh.length-1].name+'保修到哪天','#i-shield');
  /* 通用兜底 */
  add('哪件快过保了','#i-clock');
  add('拍凭证建档','#i-camera','recog');
  add('我的档案','#i-folder','archive');
  return pool;
}
let lastChipKey = '';
function pickChips(pool){
  if(pool.length<=3){ lastChipKey = pool.map(c=>c.label).sort().join('|'); return pool.slice(); }
  const head = pool[0], rest = pool.slice(1);
  let picks = null, key = '';
  for(let i=0;i<8;i++){
    const s = rest.slice();
    for(let j=s.length-1;j>0;j--){ const k = Math.floor(Math.random()*(j+1)); const t = s[j]; s[j] = s[k]; s[k] = t; }
    picks = [head, s[0], s[1]];
    key = picks.map(c=>c.label).sort().join('|');
    if(key!==lastChipKey) break;
  }
  lastChipKey = key;
  return picks;
}
function renderChips(){
  document.getElementById('chipRow').innerHTML = pickChips(chipPool()).map(c=>
    '<button class="chip" data-act="'+c.act+'" onclick="chipClick(this)"><svg class="ic"><use href="'+c.icon+'"/></svg>'+esc(c.label)+'</button>'
  ).join('');
}
function chipClick(btn){
  const act = btn.getAttribute('data-act') || 'send';
  if(act==='recog'){ openRecog(); return; }
  if(act==='archive'){ switchView('archive'); return; }
  if(act==='reminders'){ switchView('reminders'); return; }
  if(act==='demo'){ enterDemoMode(); return; }
  if(act==='exitDemo'){ exitDemoMode(); return; }
  if(act==='manual'){ openProductForm(); return; }
  const t = btn.textContent.trim();
  document.getElementById('chatText').value = t; sendChat();
}
function pushMsg(role, text, html){
  store.chat.push({role, text:text||'', html:html||''});
  if(store.chat.length>60) store.chat = store.chat.slice(-60);
  save(); renderChat(); renderChips();

function renderChat(){
  const el = document.getElementById('chatLog');
  el.innerHTML = store.chat.map(m=>{
    if(m.role==='user') return '<div class="msg-row user"><div class="msg user">'+esc(m.text)+'</div></div>';
    return '<div class="msg-row bot"><div class="avatar" aria-hidden="true"><svg class="ic"><use href="#i-shield"/></svg></div><div class="msg bot'+(m.html?' has-html':'')+'">'+esc(m.text)+(m.html||'')+'</div></div>';
  }).join('');
  fixCcTlLabels(el);
  el.scrollTop = el.scrollHeight;
  if(curView==='chat') jumpTo(document.body.scrollHeight); /* 仅对话页在前台时才把窗口拉到底；初始化在首页调用时不许劫持首页滚动 */
}
function botSay(text, html){ pushMsg('bot', text, html); }
function findProduct(text){
  let best = null;
  const KEYWORDS = ['冰箱','空调','电视','手机','吸尘器','电饭煲','热水器','洗碗机','微波炉','洗衣机','烘干机','净水器','油烟机','电脑'];
  store.products.forEach(p=>{
    [p.name, p.brand, p.category, p.model].forEach(k=>{
      if(k && k.length>=2 && text.includes(k)) best = p;
    });
    KEYWORDS.forEach(kw=>{ if(p.name.includes(kw) && text.includes(kw)) best = p; });
  });
  return best;
}
function sendChat(){
  const input = document.getElementById('chatText');
  const text = input.value.trim(); if(!text) return;
  input.value = '';
  pushMsg('user', text);
  if(aiConfigured()){
    /* V2.3 查杀④：占位消息按对象引用回填，不按下标记忆位置——等待期间新消息插入/60 条截断/双窗口合并
       都会让下标漂移，旧写法会把回复盖到别人头上或删错一条。引用找不到（已被截断/合并替换）时，
       成功则把回复作为新消息补上，失败则不再误删任何一条。 */
    const typingMsg = {role:'bot', text:'', html:'<span class="typing" role="status" aria-label="管家正在思考"><i></i><i></i><i></i></span>'};
    store.chat.push(typingMsg);
    save(); renderChat();
    aiAnswer(text).then(res=>{
      const i = store.chat.indexOf(typingMsg);
      if(i>=0) store.chat[i] = {role:'bot', text:res.text||'', html:res.html||''};
      else store.chat.push({role:'bot', text:res.text||'', html:res.html||''});
      save(); renderChat();
    }).catch((e)=>{ const i = store.chat.indexOf(typingMsg); if(i>=0) store.chat.splice(i,1); save(); botSay(e && e.userMessage ? e.userMessage : 'AI 暂时连不上（网络或接口异常），已切换本地规则模式为你解答。'); botReply(text); });
  } else setTimeout(()=> botReply(text), 60);
}
/* ---------- 语音输入（浏览器原生识别，不接任何外部语音服务） ----------
   仅当浏览器提供 SpeechRecognition 时才显示麦克风按钮（不支持的浏览器按钮恒隐藏）；
   识别文本实时回填输入框：final 段累积、interim 段跟随刷新；再点一次或自然结束即停。 */
let voiceRec = null, voiceOn = false;
function voiceSupported(){ try{ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }catch(e){ return false; } }
function initVoiceBtn(){ try{ if(voiceSupported()){ const b = document.getElementById('micBtn'); if(b) b.style.display = 'grid'; } }catch(e){} }
function voiceUi(on){
  const b = document.getElementById('micBtn'); if(!b) return;
  b.classList.toggle('rec', on);
  b.setAttribute('aria-label', on ? '停止语音输入' : '语音输入');
}
function toggleVoice(){
  if(voiceOn){ try{ if(voiceRec) voiceRec.stop(); }catch(e){} return; }
  if(!voiceSupported()){ toast('当前浏览器不支持语音输入'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  try{ rec = new SR(); }catch(e){ toast('语音输入启动失败，请稍后再试'); return; }
  voiceRec = rec;
  rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = false;
  const input = document.getElementById('chatText');
  const base = input.value;
  let finalSeg = '';
  rec.onresult = ev=>{
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) finalSeg += t; else interim += t;
    }
    input.value = base + finalSeg + interim;
  };
  rec.onerror = ev=>{
    const code = ev && ev.error;
    if(code === 'not-allowed' || code === 'service-not-allowed') toast('麦克风权限被拒绝，请在浏览器设置中允许麦克风后重试');
    else if(code === 'no-speech') toast('没有听到声音，请再说一次');
    else if(code === 'audio-capture') toast('没有找到可用的麦克风');
    else if(code === 'aborted'){ /* 用户主动停止：不在此报错，onend 统一收尾 */ }
    else toast('语音识别出错了，请再试一次');
  };
  rec.onend = ()=>{ voiceOn = false; voiceRec = null; voiceUi(false); };

async function arkChat(messages, maxTokens){

/* 事实纠偏（v1.3）：模型输出里的日期/剩余天数/档位与事实包不一致时，以事实包为准加注纠正 */
function aiReconcile(text, product){
  if(!product || !text) return { text, corrected:false };
  const c = conclOf(product);
  const issues = [];
  const knownDates = new Set([c.endWhole, c.endParts, product.purchase_date, product.invoice_date, product.activation_date].filter(Boolean));
  (String(text).match(/\d{4}-\d{2}-\d{2}/g)||[]).forEach(d=>{ if(!knownDates.has(d)) issues.push('日期 '+d); });
  const knownDays = new Set([c.daysWhole, c.daysParts].filter(x=>x!==null && x!==undefined).map(x=>Math.abs(x)));
  const dayRe = /(?:剩余|还剩|已过保|过保)\s*(\d+)\s*天/g; let m;
  while((m = dayRe.exec(text))){ if(!knownDays.has(Number(m[1]))) issues.push('天数 '+m[1]); }
  const tierRe = /档位\s*([1-6])|([1-6])\s*档/g;
  while((m = tierRe.exec(text))){ const t = Number(m[1]||m[2]); if(t!==c.tier) issues.push('档位 '+t); }
  if(!issues.length) return { text, corrected:false };
  const fix = '\n—— 管家核对（以档案事实为准）：'+product.name+' 整机到期 '+(c.endWhole||'—')+'（'+(c.daysWhole===null ? '天数未知' : (c.daysWhole<0 ? '已过保 '+Math.abs(c.daysWhole)+' 天' : '剩余 '+c.daysWhole+' 天'))+'），结论档位 '+c.tier+' '+c.tierLabel+'。上文有 '+issues.length+' 处数字与档案不一致（'+issues.join('、')+'），请以本核对为准。';
  return { text: text+fix, corrected:true, issues };
}

    const img = new Image();
    img.onload = ()=>{ try{
      const max = 1280, sc = Math.min(1, max/Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', .85));
    }catch(err){ reject(err); } };
    img.onerror = reject;
    img.src = url;
  });
}
